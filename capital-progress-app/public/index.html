        );
        const modelStatusLabels = {
          ready: "已有语音",
          generating: "生成中",
          queued: "排队中",
          failed: "可重试",
          interrupted: "可继续",
          missing: "未生成",
        };
        const modelOptions = (audio.models || []).map((item) => {
          const showProgress = ["generating", "failed", "interrupted"].includes(
            item.status
          );
          const completed = Math.max(0, Number(item.completedChunks || 0));
          const total = Math.max(0, Number(item.chunkCount || 0));
          const progress = showProgress && total
            ? `${Math.min(completed, total)}/${total} · ${Math.round((Math.min(completed, total) / total) * 100)}%`
            : "";
          return {
            id: item.id,
            label: `${item.label} · ${modelStatusLabels[item.status] || item.status}${progress ? ` · ${progress}` : ""}`,
          };
        });
        const duplicateModels = readyVersions.reduce((counts, item) => {
          counts[item.modelId] = (counts[item.modelId] || 0) + 1;
          return counts;
        }, {});
        const audioOptions = readyVersions.map((item) => ({
          id: item.id,
          label:
            item.patchedChunkId
              ? `${item.modelLabel} · 修正版 · ${dateText(item.updatedAt)}`
              : duplicateModels[item.modelId] > 1
                ? `${item.modelLabel} · ${dateText(item.updatedAt)}`
                : item.modelLabel,
          adopted: item.adopted,
        }));
        const generation = selectedModel && ["generating", "queued"].includes(
          selectedModel.status
        )
          ? `${selectedModel.label}${selectedModel.status === "queued" ? "排队中" : "生成中"}${selectedModel.chunkCount ? ` ${selectedModel.completedChunks}/${selectedModel.chunkCount}` : ""}`
          : "";

        return `
          <section class="audio-manager" aria-label="语音版本">
            <div class="audio-manager-main">
              <span class="audio-status ${escapeHtml(audio.status)}">${escapeHtml(audio.label)}</span>
              ${audioOptions.length
                ? renderVersionPicker({
                    id: `audio-version-${version.id}`,
                    versions: audioOptions,
                    selectedId: selectedVersion?.id,
                    action: "audio-version",
                    label: "选择语音版本",
                  })
                : ""}
              ${selectedVersion
                ? '<button class="small-action" id="previewAudioButton">试听</button>'
                : ""}
              ${selectedVersion && version.adopted
                ? `<button class="small-action ${model.speechPatch.active ? "active" : ""}" id="speechPatchButton" aria-pressed="${model.speechPatch.active}">${model.speechPatch.active ? "退出修正" : "修正朗读"}</button>`
                : ""}
              ${selectedVersion && !selectedVersion.adopted && version.adopted
                ? '<button class="small-action" id="adoptAudioButton">采用此语音</button>'
                : ""}
              ${publication
                ? `<span class="audio-publish-state" data-status="${escapeHtml(publication.status)}">${escapeHtml(publication.label)}</span>`
                : ""}
              ${selectedVersion?.adopted && version.adopted && publication?.canPublish && !publishing && model.state.audioPublishing?.configured
                ? `<button class="small-action" id="publishAudioButton">${publication.status === "interrupted" ? "继续上传" : publication.status === "failed" ? "重新上传" : "上传到预览站"}</button>`
                : ""}
            </div>
            ${patchStatus
              ? `<div class="audio-operation ${escapeHtml(patchStatus.status || "")}" role="status" aria-live="polite">
                  <strong>${escapeHtml(patchStatus.label || "语音修正")}</strong>
                  ${patchStatus.detail ? `<span class="audio-operation-detail">${escapeHtml(patchStatus.detail)}</span>` : ""}
                </div>`
              : ""}
              ${version.adopted && modelOptions.length
                ? `<div class="audio-manager-actions">
                  <span class="audio-manager-label">生成</span>
                  ${renderVersionPicker({
                    id: `audio-model-${version.id}`,
                    versions: modelOptions,
                    selectedId: selectedModel?.id,
                    action: "audio-model",
                    label: "选择语音模型",
                  })}
                  ${selectedModel?.canGenerate
                    ? `<button class="small-action" id="generateAudioButton" aria-label="生成语音，使用 ${escapeHtml(selectedModel.label)}">生成 ${escapeHtml(selectedModel.label)}</button>`
                    : generation
                      ? `<span class="audio-manager-label">${escapeHtml(generation)}</span>`
                      : ""}
                </div>`
              : ""}
            ${generationPlan
              ? `<div class="audio-generation-plan" role="status" aria-live="polite">
                  <strong>生成前确认</strong>
                  ${generationPlan.error
                    ? `<span>${escapeHtml(generationPlan.error)}</span>`
                    : `<span>${generationPlan.cachedChunkCount
                        ? `当前版本已有 ${generationPlan.cachedChunkCount} 块本地语音。`
                        : ""}${generationPlan.baseTranslationVersionId && generationPlan.baseReusableChunkCount
                        ? `另可从 ${escapeHtml(generationPlan.baseTranslationVersionId)} 复用 ${generationPlan.baseReusableChunkCount} 块。`
                        : ""}共 ${generationPlan.reusableChunkCount}/${generationPlan.chunkCount} 块无需调用接口；本次将新生成 ${generationPlan.generatedChunkCount} 块，共约 ${Number(generationPlan.generatedCharacterCount || 0).toLocaleString("zh-CN")} 个字。接口重试可能产生额外调用。</span>`}
                  <div class="audio-generation-plan-actions">
                    ${generationPlan.error
                      ? ""
                      : `<button class="small-action" id="confirmGenerateAudioButton">确认生成 ${generationPlan.generatedChunkCount} 块</button>`}
                    <button class="small-action" id="cancelGenerateAudioButton">取消</button>
                  </div>
                </div>`
              : ""}
          </section>
        `;
      }

      function renderSpeechPatchPanel(unit, version) {
        const patch = model.speechPatch;
        if (
          !patch.active ||
          patch.unitId !== unit?.unit_id ||
          patch.translationVersionId !== version?.id
        ) {
          return "";
        }
        const sentence = narration.manifest?.sentences?.find(
          (item) => item.id === patch.selectedSentenceId
        );
        const chunk = narration.manifest?.chunks?.find(
          (item) => item.id === sentence?.chunk_id
        );
        if (!sentence || !chunk) {
          return `
            <section class="speech-patch-panel" id="speechPatchPanel" aria-live="polite">
              <div class="speech-patch-heading">
                <strong>选择要修正的句子</strong>
                <span>点正文中的任意一句</span>
              </div>
              <p class="speech-patch-hint">这里只改变送给语音模型的文字，不会修改译文。选中后会先告诉你需要重生成哪个分块。</p>
              <div class="speech-patch-actions">
                <button class="small-action" id="cancelSpeechPatchButton" type="button">完成</button>
              </div>
            </section>
          `;
        }
        const chunks = narration.manifest?.chunks || [];
        const reused = Math.max(0, chunks.length - 1);
        const duration = formatNarrationTime(Number(chunk.duration_ms || 0));
        const sentenceCount = chunk.sentence_ids?.length || 0;
        return `
          <section class="speech-patch-panel" id="speechPatchPanel" aria-live="polite">
            <div class="speech-patch-heading">
              <strong>修正这句话的朗读</strong>
              <span>${escapeHtml(chunk.id)} · 约 ${duration}</span>
            </div>
            <p class="speech-patch-source">${escapeHtml(sentence.text)}</p>
            <label class="speech-patch-field" for="speechPatchText">
              朗读为
              <textarea id="speechPatchText" maxlength="1200" spellcheck="false">${escapeHtml(patch.draft)}</textarea>
            </label>
            <div class="speech-patch-impact">
              <span>只重生成这个分块（${sentenceCount} 句），其余 ${reused}/${chunks.length} 个分块直接复用。</span>
              <span>会生成新的语音版本，原版本不变。</span>
            </div>
            ${patch.error ? `<div class="speech-patch-error">${escapeHtml(patch.error)}</div>` : ""}
            <div class="speech-patch-actions">
              <button class="small-action" id="clearSpeechPatchSentenceButton" type="button">重新选句</button>
              <button class="small-action active" id="submitSpeechPatchButton" type="button" ${patch.submitting ? "disabled" : ""}>${patch.submitting ? "正在启动" : "只重生成此分块"}</button>
            </div>
          </section>
        `;
      }

      function renderText(unit) {
        const version = displayedVersion(unit);
        const preview = version?.preview || unit?.preview || "";
        if (!preview) {
          return '<div class="empty">尚未形成译文。</div>';
        }
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)}</h3>
            <div class="version-tools">
              ${unit.versions.length > 1
                ? renderVersionPicker({
                    id: "display-version",
                    versions: unit.versions,
                    selectedId: version?.id,
                    action: "display",
                    label: "选择阅读版本",
                  })
                : `<span class="version-tag">${version?.label || ""}</span>`}
              ${unit.versions.length > 1
                ? '<button class="small-action" id="compareButton">比较版本</button>'
                : ""}
              ${version?.adopted
                ? '<span class="adopted-mark">已采用</span>'
                : version?.reviewStatus === "needs_review"
                  ? '<span class="version-tag">待复核</span>'
                : version
                  ? '<button class="small-action" id="adoptButton">采用此版本</button>'
                  : ""}
              ${version?.audio?.status === "ready"
                ? '<button class="small-action" id="narrationStartButton">▶ 朗读本节</button>'
                : ""}
            </div>
          </div>
          ${renderAudioManager(unit, version)}
          ${renderSpeechPatchPanel(unit, version)}
          ${version?.reviewStatus === "needs_review" && version?.reviewNote
            ? `<div class="review-notice"><strong>终审待复核：</strong>${escapeHtml(version.reviewNote)}</div>`
            : ""}
          <div class="prose">${renderMarkdown(stripLeadingDocumentHeadings(preview))}</div>
        `;
      }

      function renderComparison(unit) {
        if (!unit?.versions || unit.versions.length < 2) {
          return '<div class="empty">至少需要两个版本才能比较。</div>';
        }
        const { base, target } = comparisonPair(unit);
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)} · 版本比较</h3>
            <button class="small-action" id="closeCompareButton">返回正文</button>
          </div>
          <div class="diff-toolbar">
            <div class="diff-choice">
              <span>原版本</span>
              ${renderVersionPicker({
                id: "compare-base",
                versions: unit.versions,
                selectedId: base?.id,
                action: "compare-base",
                label: "选择作为比较起点的版本",
              })}
            </div>
            <span class="diff-arrow">→</span>
            <div class="diff-choice">
              <span>新版本</span>
              ${renderVersionPicker({
                id: "compare-target",
                versions: unit.versions,
                selectedId: target?.id,
                action: "compare-target",
                label: "选择要比较的新版本",
              })}
            </div>
            <div class="diff-mode" role="group" aria-label="差异显示方式">
              <button
                class="small-action ${model.diffMode === "inline" ? "active" : ""}"
                type="button"
                data-diff-mode="inline"
                aria-pressed="${model.diffMode === "inline"}"
              >行内</button>
              <button
                class="small-action ${model.diffMode === "paragraph" ? "active" : ""}"
                type="button"
                data-diff-mode="paragraph"
                aria-pressed="${model.diffMode === "paragraph"}"
              >整段</button>
            </div>
            <button class="small-action diff-filter" id="diffFilterButton">
              ${model.diffOnly ? "显示全文" : "只看改动"}
            </button>
          </div>
          <div class="diff-legend" aria-label="差异标记说明">
            <span class="removed">删去</span>
            <span class="added">新增</span>
          </div>
          <div class="prose diff-prose ${model.diffMode === "paragraph" ? "paragraph-mode" : "inline-mode"}">
            ${renderVersionDiff(
              base?.preview || "",
              target?.preview || "",
              model.diffOnly,
              model.diffMode
            )}
          </div>
        `;
      }

      function renderVersions(unit) {
        if (!unit?.versions?.length) {
          return '<div class="empty">暂无版本。</div>';
        }
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)}</h3>
          </div>
          <div class="versions">
            ${unit.versions.map((version) => `
              <div class="version-row">
                <strong>${escapeHtml(version.label)}</strong>
                <p>${escapeHtml(version.summary || version.status)}${version.taskCount ? ` · ${version.taskCount} 个片段` : ""}</p>
                <time>${dateText(version.updatedAt)}</time>
                <div class="version-actions">
                  <button class="small-action" data-preview-version="${version.id}">预览</button>
                  ${version.adopted
                    ? '<span class="adopted-mark">已采用</span>'
                    : version.reviewStatus === "needs_review"
                      ? '<span class="version-tag">待复核</span>'
                    : `<button class="small-action" data-adopt-version="${version.id}">采用</button>`}
                  ${version.audio ? `<span class="audio-status ${escapeHtml(version.audio.status)}">${escapeHtml(version.audio.label)}${(version.audio.versions || []).filter((audio) => audio.status === "ready").length > 1 ? ` · ${(version.audio.versions || []).filter((audio) => audio.status === "ready").length} 个版本` : ""}</span>` : ""}
                </div>
                ${version.audio?.error ? `<div class="audio-error">${escapeHtml(version.audio.error)}</div>` : ""}
                ${version.reviewStatus === "needs_review" && version.reviewNote
                  ? `<div class="review-notice"><strong>终审待复核：</strong>${escapeHtml(version.reviewNote)}</div>`
                  : ""}
              </div>
            `).join("")}
          </div>
        `;
      }

      async function adoptVersion(versionId) {
        const unit = currentUnit();
        if (!unit || !versionId) return;
        const response = await fetch("/api/adopt", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            unitId: unit.unit_id,
            versionId,
          }),
        });
        if (!response.ok) throw new Error("adoption failed");
        model.selectedVersionId = versionId;
        saveReadingPosition();
        await refresh(true);
      }

      async function requestAudioGenerationPlan(modelId) {
        const unit = currentUnit();
        const version = displayedVersion(unit);
        if (!unit?.unit_id || !version?.id || !modelId) return;
        const response = await fetch("/api/audio/plan", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ unitId: unit.unit_id, modelId }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "无法估算语音生成量");
        model.audioGenerationPlan = {
          unitId: unit.unit_id,
          versionId: version.id,
          modelId,
          planToken: result.planToken,
          baseTranslationVersionId: result.base_translation_version_id || "",
          chunkCount: Number(result.chunk_count || 0),
          baseReusableChunkCount: Number(result.base_reusable_chunk_count || 0),
          cachedChunkCount: Number(result.cached_chunk_count || 0),
          reusableChunkCount: Number(result.reusable_chunk_count || 0),
          generatedChunkCount: Number(result.generated_chunk_count || 0),
          generatedCharacterCount: Number(result.generated_character_count || 0),
          error: "",
        };
      }

      async function generateAudio(modelId, planToken) {
        const unit = currentUnit();
        if (!unit?.unit_id || !modelId || !planToken) return;
        const response = await fetch("/api/audio/generate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ unitId: unit.unit_id, modelId, planToken }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "语音任务未能启动");
        await refresh(true);
      }

      async function adoptAudioVersion(audioVersionId) {
        const unit = currentUnit();
        const version = displayedVersion(unit);
        if (!unit || !version?.id || !audioVersionId) return;
        const response = await fetch("/api/audio/adopt", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            unitId: unit.unit_id,
            translationVersionId: version.id,
            audioVersionId,
          }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "语音版本未能采用");
        await refresh(true);
      }

      async function publishAudioVersion(audioVersionId) {
        const unit = currentUnit();
        const version = displayedVersion(unit);
        if (!unit || !version?.id || !audioVersionId) return;
        const response = await fetch("/api/audio/publish", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            unitId: unit.unit_id,
            translationVersionId: version.id,
            audioVersionId,
          }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "语音上传未能启动");
        await refresh(true);
      }

      async function previewAudioVersion(audioVersionId) {
        const unit = currentUnit();
        const version = displayedVersion(unit);
        if (!unit || !version || !audioVersionId) return;
        await prepareNarration(unit, {
          ...version,
          audio: {
            ...version.audio,
            status: "ready",
            audioVersionId,
          },
        });
        await resumeNarration();
      }

      function resetSpeechPatch() {
        Object.assign(model.speechPatch, {
          active: false,
          unitId: "",
          translationVersionId: "",
          baseAudioVersionId: "",
          selectedSentenceId: "",
          draft: "",
          error: "",
          submitting: false,
        });
      }

      async function toggleSpeechPatch() {
        if (model.speechPatch.active) {
          resetSpeechPatch();
          renderReader();
          return;
        }
        const unit = currentUnit();
        const version = displayedVersion(unit);
        const audioVersion = selectedAudioVersion(unit, version);
        if (!unit || !version?.adopted || !audioVersion?.id) return;
        model.speechPatchNotice = null;
        Object.assign(model.speechPatch, {
          active: true,
          unitId: unit.unit_id,
          translationVersionId: version.id,
          baseAudioVersionId: audioVersion.id,
          selectedSentenceId: "",
          draft: "",
          error: "",
          submitting: false,
        });
        const audio = el("narrationAudio");
        audio.pause();
        try {
          await prepareNarration(unit, {
            ...version,
            audio: {
              ...version.audio,
              status: "ready",
              audioVersionId: audioVersion.id,
            },
          });
          renderReader();
        } catch (error) {
          model.speechPatch.error =
            error instanceof Error ? error.message : "语音清单不可用";
          renderReader();
        }
      }

      function selectSpeechPatchSentence(sentenceId) {
        if (!model.speechPatch.active) return;
        const sentence = narration.manifest?.sentences?.find(
          (item) => item.id === sentenceId
        );
        if (!sentence) return;
        model.speechPatch.selectedSentenceId = sentenceId;
        model.speechPatch.draft = sentence.speech_text || sentence.text || "";
        model.speechPatch.error = "";
        setActiveNarrationSentence(sentenceId, false);
        renderReader();
        requestAnimationFrame(() => el("speechPatchText")?.focus());
      }

      async function submitSpeechPatch() {
        const patch = model.speechPatch;
        const unit = currentUnit();
        const version = displayedVersion(unit);
        const sentence = narration.manifest?.sentences?.find(
          (item) => item.id === patch.selectedSentenceId
        );
        const speechText = patch.draft.replace(/\s+/g, " ").trim();
        if (!sentence || !speechText) {
          patch.error = "请先选择一句并填写朗读文本。";
          renderReader();
          return;
        }
        if (speechText === String(sentence.speech_text || sentence.text || "")) {
          patch.error = "朗读文本没有变化。";
          renderReader();
          return;
        }
        patch.submitting = true;
        patch.error = "";
        renderReader();
        try {
          const response = await fetch("/api/audio/patch", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              unitId: unit.unit_id,
              translationVersionId: version.id,
              baseAudioVersionId: patch.baseAudioVersionId,
              sentenceId: sentence.id,
              speechText,
            }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(result.error || "语音修正未能启动");
          }
          model.pendingSpeechPatch = {
            unitId: unit.unit_id,
            translationVersionId: version.id,
            baseAudioVersionId: patch.baseAudioVersionId,
            sentenceId: sentence.id,
            submittedAt: new Date().toISOString(),
          };
          model.speechPatchNotice = {
            unitId: unit.unit_id,
            translationVersionId: version.id,
            status: result.status || "queued",
            label:
              result.status === "generating"
                ? "语音分块修正中"
                : "语音修正已进入队列",
            detail: "完成后会自动切换到新的修正版。",
          };
          resetSpeechPatch();
          await refresh(true);
        } catch (error) {
          patch.submitting = false;
          patch.error =
            error instanceof Error ? error.message : "语音修正未能启动";
          renderReader();
        }
      }

      function reconcilePendingSpeechPatch() {
        const pending = model.pendingSpeechPatch;
        if (!pending) return;
        const unit = allUnits().find(
          (item) => item.unit_id === pending.unitId
        );
        const version = unit?.versions?.find(
          (item) => item.id === pending.translationVersionId
        );
        if (!unit || !version) return;
        const submittedAt = Date.parse(pending.submittedAt || "") || 0;
        const completed = (version.audio?.versions || [])
          .filter(
            (item) =>
              item.status === "ready" &&
              item.baseAudioVersionId === pending.baseAudioVersionId &&
              item.id !== pending.baseAudioVersionId &&
              (Date.parse(item.updatedAt || "") || 0) >= submittedAt - 1_000
          )
          .sort((left, right) =>
            String(right.updatedAt || "").localeCompare(
              String(left.updatedAt || "")
            )
          )[0];
        if (completed) {
          model.audioVersionSelections[audioSelectionKey(unit, version)] =
            completed.id;
          model.speechPatchNotice = {
            unitId: unit.unit_id,
            translationVersionId: version.id,
            status: "ready",
            label: "修正版已完成",
            detail: "已自动切换，可以直接点击原句试听。",
          };
          model.pendingSpeechPatch = null;
          return;
        }
        const generation = version.audio?.generation;
        if (generation?.operation !== "patch") return;
        model.speechPatchNotice = {
          unitId: unit.unit_id,
          translationVersionId: version.id,
          status: generation.status,
          label: generation.label || "语音修正",
          detail:
            generation.error ||
            (generation.status === "queued"
              ? "正在等待前面的语音任务完成。"
              : "只会重新生成所选句子所在的分块。"),
        };
        if (generation.status === "failed") {
          model.pendingSpeechPatch = null;
        }
      }

      function closeVersionPickers() {
        document.querySelectorAll("[data-picker-menu]").forEach((menu) => {
          menu.hidden = true;
        });
        document.querySelectorAll("[data-picker-trigger]").forEach((trigger) => {
          trigger.setAttribute("aria-expanded", "false");
        });
      }

      function bindVersionPickers() {
        document.querySelectorAll("[data-version-picker]").forEach((picker) => {
          const trigger = picker.querySelector("[data-picker-trigger]");
          const menu = picker.querySelector("[data-picker-menu]");
          const options = Array.from(
            picker.querySelectorAll("[data-picker-action]")
          );
          trigger.addEventListener("click", (event) => {
            event.stopPropagation();
            const shouldOpen = menu.hidden;
            closeVersionPickers();
            menu.hidden = !shouldOpen;
            trigger.setAttribute("aria-expanded", String(shouldOpen));
            if (shouldOpen) {
              options.find(
                (option) => option.getAttribute("aria-selected") === "true"
              )?.focus();
            }
          });
          options.forEach((option, index) => {
            option.addEventListener("click", () => {
              const action = option.dataset.pickerAction;
              const value = option.dataset.pickerValue;
              closeVersionPickers();
              if (action === "display") {
                model.selectedVersionId = value;
                saveReadingPosition();
              } else if (action === "compare-base") {
                model.compareBaseVersionId = value;
                if (model.compareTargetVersionId === value) {
                  model.compareTargetVersionId =
                    currentUnit()?.versions.find(
                      (version) => version.id !== value
                    )?.id || null;
                }
              } else if (action === "compare-target") {
                model.compareTargetVersionId = value;
                if (model.compareBaseVersionId === value) {
                  model.compareBaseVersionId =
                    currentUnit()?.versions.find(
                      (version) => version.id !== value
                    )?.id || null;
                }
              } else if (action === "audio-model") {
                const unit = currentUnit();
                const version = displayedVersion(unit);
                model.audioModelSelections[audioSelectionKey(unit, version)] = value;
                model.audioGenerationPlan = null;
              } else if (action === "audio-version") {
                const unit = currentUnit();
                const version = displayedVersion(unit);
                resetSpeechPatch();
                model.audioVersionSelections[audioSelectionKey(unit, version)] = value;
              }
              renderReader();
            });
            option.addEventListener("keydown", (event) => {
              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                const direction = event.key === "ArrowDown" ? 1 : -1;
                options[(index + direction + options.length) % options.length]
                  ?.focus();
              } else if (event.key === "Escape") {
                closeVersionPickers();
                trigger.focus();
              }
            });
          });
        });
      }

      function bindReaderActions() {
        bindVersionPickers();
        const compareButton = el("compareButton");
        if (compareButton) {
          compareButton.addEventListener("click", () => {
            model.compareMode = true;
            model.compareBaseVersionId = null;
            model.compareTargetVersionId = displayedVersion()?.id || null;
            renderReader();
          });
        }
        const closeCompareButton = el("closeCompareButton");
        if (closeCompareButton) {
          closeCompareButton.addEventListener("click", () => {
            model.compareMode = false;
            renderReader();
          });
        }
        const diffFilterButton = el("diffFilterButton");
        if (diffFilterButton) {
          diffFilterButton.addEventListener("click", () => {
            model.diffOnly = !model.diffOnly;
            renderReader();
          });
        }
        document.querySelectorAll("[data-diff-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            model.diffMode = button.dataset.diffMode;
            renderReader();
          });
        });
        const adoptButton = el("adoptButton");
        if (adoptButton) {
          adoptButton.addEventListener("click", async () => {
            try {
              await adoptVersion(displayedVersion()?.id);
            } catch {
              adoptButton.textContent = "未能采用";
            }
          });
        }
        const narrationStartButton = el("narrationStartButton");
        if (narrationStartButton) {
          narrationStartButton.addEventListener("click", async () => {
            narrationStartButton.disabled = true;
            const original = narrationStartButton.textContent;
            narrationStartButton.textContent = "正在准备";
            try {
              const unit = currentUnit();
              const version = displayedVersion(unit);
              await prepareNarration(unit, version);
              await resumeNarration();
              narrationStartButton.textContent = "继续朗读";
            } catch {
              narrationStartButton.textContent = "语音不可用";
            } finally {
              narrationStartButton.disabled = false;
              if (!narration.manifest) {
                narrationStartButton.textContent = original;
              }
            }
          });
        }
        const generateAudioButton = el("generateAudioButton");
        if (generateAudioButton) {
          generateAudioButton.addEventListener("click", async () => {
            const unit = currentUnit();
            const version = displayedVersion(unit);
            const audioModel = selectedAudioModel(unit, version);
            if (audioModel) {
              model.audioModelSelections[audioSelectionKey(unit, version)] =
                audioModel.id;
            }
            generateAudioButton.disabled = true;
            generateAudioButton.textContent = "正在计算";
            try {
              await requestAudioGenerationPlan(audioModel?.id);
              renderReader();
            } catch (error) {
              model.audioGenerationPlan = {
                unitId: unit?.unit_id || "",
                versionId: version?.id || "",
                modelId: audioModel?.id || "",
                error: error instanceof Error ? error.message : "无法估算语音生成量",
              };
              renderReader();
            }
          });
        }
        const confirmGenerateAudioButton = el("confirmGenerateAudioButton");
        if (confirmGenerateAudioButton) {
          confirmGenerateAudioButton.addEventListener("click", async () => {
            const plan = model.audioGenerationPlan;
            if (!plan?.planToken) return;
            confirmGenerateAudioButton.disabled = true;
            confirmGenerateAudioButton.textContent = "正在启动";
            try {
              await generateAudio(plan.modelId, plan.planToken);
              model.audioGenerationPlan = null;
            } catch (error) {
              model.audioGenerationPlan = {
                ...plan,
                error: error instanceof Error ? error.message : "语音任务未能启动",
              };
              renderReader();
            }
          });
        }
        const cancelGenerateAudioButton = el("cancelGenerateAudioButton");
        if (cancelGenerateAudioButton) {
          cancelGenerateAudioButton.addEventListener("click", () => {
            model.audioGenerationPlan = null;
            renderReader();
          });
        }
        const previewAudioButton = el("previewAudioButton");
        if (previewAudioButton) {
          previewAudioButton.addEventListener("click", async () => {
            const unit = currentUnit();
            const version = displayedVersion(unit);
            const audioVersion = selectedAudioVersion(unit, version);
            previewAudioButton.disabled = true;
            previewAudioButton.textContent = "正在准备";
            try {
              await previewAudioVersion(audioVersion?.id);
              previewAudioButton.textContent = "正在试听";
            } catch {
              previewAudioButton.textContent = "语音不可用";
            } finally {
              previewAudioButton.disabled = false;
            }
          });
        }
        const speechPatchButton = el("speechPatchButton");
        if (speechPatchButton) {
          speechPatchButton.addEventListener("click", async () => {
            speechPatchButton.disabled = true;
            try {
              await toggleSpeechPatch();
            } finally {
              if (speechPatchButton.isConnected) {
                speechPatchButton.disabled = false;
              }
            }
          });
        }
        el("cancelSpeechPatchButton")?.addEventListener("click", () => {
          resetSpeechPatch();
          renderReader();
        });
        el("clearSpeechPatchSentenceButton")?.addEventListener("click", () => {
          model.speechPatch.selectedSentenceId = "";
          model.speechPatch.draft = "";
          model.speechPatch.error = "";
          setActiveNarrationSentence("", false);
          renderReader();
        });
        el("speechPatchText")?.addEventListener("input", (event) => {
          model.speechPatch.draft = event.currentTarget.value;
          model.speechPatch.error = "";
        });
        el("submitSpeechPatchButton")?.addEventListener("click", () => {
          void submitSpeechPatch();
        });
        const adoptAudioButton = el("adoptAudioButton");
        if (adoptAudioButton) {
          adoptAudioButton.addEventListener("click", async () => {
            const unit = currentUnit();
            const version = displayedVersion(unit);
            const audioVersion = selectedAudioVersion(unit, version);
            adoptAudioButton.disabled = true;
            try {
              await adoptAudioVersion(audioVersion?.id);
            } catch (error) {
              adoptAudioButton.disabled = false;
              adoptAudioButton.textContent =
                error instanceof Error ? error.message : "未能采用";
            }
          });
        }
        const publishAudioButton = el("publishAudioButton");
        if (publishAudioButton) {
          publishAudioButton.addEventListener("click", async () => {
            const unit = currentUnit();
            const version = displayedVersion(unit);
            const audioVersion = selectedAudioVersion(unit, version);
            publishAudioButton.disabled = true;
            publishAudioButton.textContent = "正在准备";
            try {
              await publishAudioVersion(audioVersion?.id);
            } catch (error) {
              publishAudioButton.disabled = false;
              publishAudioButton.textContent =
                error instanceof Error ? error.message : "未能上传";
            }
          });
        }
        document.querySelectorAll("[data-preview-version]").forEach((button) => {
          button.addEventListener("click", () => {
            model.selectedVersionId = button.dataset.previewVersion;
            model.view = "text";
            model.compareMode = false;
            saveReadingPosition();
            render();
          });
        });
        document.querySelectorAll("[data-adopt-version]").forEach((button) => {
          button.addEventListener("click", async () => {
            try {
              await adoptVersion(button.dataset.adoptVersion);
            } catch {
              button.textContent = "未能采用";
            }
          });
        });
      }

      function renderReader() {
        const unit = currentUnit();
        el("reader").innerHTML =
          model.view === "versions"
            ? renderVersions(unit)
            : model.compareMode
              ? renderComparison(unit)
              : renderText(unit);
        bindReaderActions();
        syncNarrationForReader(unit);
      }

      function render() {
        const state = model.state;
        const chapter = currentChapter();
        if (!chapter) return;

        el("partCount").textContent = state.book.partCount;
        el("chapterCount").textContent = state.book.chapterCount;
        el("completedUnits").textContent = state.book.completedUnitCount;
        el("versionCount").textContent = state.book.versionCount;
        el("updated").textContent = `更新 ${dateText(state.updatedAt)}`;

        el("chapterPart").textContent = `第${chapter.partNumber}篇 · ${chapter.partTitle}`;
        el("chapterTitle").textContent = `${chapter.numberLabel} ${chapter.title}`;
        el("chapterStatus").textContent = chapter.statusLabel;
        el("chapterStatus").className = `status ${chapter.status}`;
        el("chapterSections").textContent =
          chapter.totalSections > 1
            ? `${chapter.completedSections}/${chapter.totalSections} 节完成`
            : "";
        el("chapterVersions").textContent =
          chapter.versionCount > 0 ? `${chapter.versionCount} 个版本` : "";

        renderCatalog();
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.view === model.view);
        });
        renderReader();
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          model.view = tab.dataset.view;
          if (model.view !== "text") model.compareMode = false;
          render();
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-version-picker]")) {
          closeVersionPickers();
        }
      });

      el("catalogExpand").addEventListener("click", () => {
        setCatalogCollapsed(false, true);
      });
      try {
        setCatalogCollapsed(
          localStorage.getItem(catalogPreferenceKey) === "true"
        );
      } catch {
        setCatalogCollapsed(false);
      }

      el("themeToggle").addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        setTheme(next, true);
      });
      themeQuery.addEventListener?.("change", (event) => {
        try {
          if (!localStorage.getItem("capital-progress-theme")) {
            setTheme(event.matches ? "dark" : "light");
          }
        } catch {}
      });
      updateThemeToggle();

      const narrationAudio = el("narrationAudio");
      narrationAudio.addEventListener("loadedmetadata", () => {
        const pending = narration.pendingStart;
        if (
          !pending ||
          narrationAudio.dataset.chunkId !== pending.chunkId
        ) {
          return;
        }
        narrationAudio.currentTime = Math.min(
          pending.seconds,
          Math.max(0, narrationAudio.duration - 0.05)
        );
        narrationAudio.playbackRate = Number(
          el("narrationRate").dataset.rate || 1
        );
        narration.pendingStart = null;
        if (pending.autoplay) void narrationAudio.play().catch(() => {});
      });
      narrationAudio.addEventListener("play", () => {
        narration.playing = true;
        updateNarrationView();
      });
      narrationAudio.addEventListener("pause", () => {
        narration.playing = false;
        updateNarrationView();
      });
      narrationAudio.addEventListener("timeupdate", updateNarrationPlayback);
      narrationAudio.addEventListener("ended", continueNarration);
      narrationAudio.addEventListener("error", () => {
        narration.playing = false;
        updateNarrationView();
      });
      el("narrationToggle").addEventListener("click", () => {
        if (narration.playing) narrationAudio.pause();
        else void resumeNarration();
      });
      el("narrationPrevious").addEventListener("click", () => stepNarration(-1));
      el("narrationNext").addEventListener("click", () => stepNarration(1));
      el("narrationProgress").addEventListener("input", (event) => {
        seekNarration(Number(event.target.value));
      });
      el("narrationRate").addEventListener("click", (event) => {
        const rates = [0.75, 1, 1.25, 1.5, 2];
        const current = Number(event.currentTarget.dataset.rate || 1);
        const next = rates[(rates.indexOf(current) + 1) % rates.length];
        event.currentTarget.dataset.rate = String(next);
        event.currentTarget.textContent = `${next}×`;
        event.currentTarget.setAttribute(
          "aria-label",
          `播放速度，当前 ${next} 倍速`
        );
        narrationAudio.playbackRate = next;
      });
      if ("mediaSession" in navigator) {
        navigator.mediaSession.setActionHandler("play", () => void resumeNarration());
        navigator.mediaSession.setActionHandler("pause", () => narrationAudio.pause());
        navigator.mediaSession.setActionHandler("previoustrack", () =>
          stepNarration(-1)
        );
        navigator.mediaSession.setActionHandler("nexttrack", () =>
          stepNarration(1)
        );
      }

      async function refresh(forceRender = false) {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error("state unavailable");
          const next = await response.json();
           const shouldRender =
             forceRender ||
             !model.state ||
             next.updatedAt !== model.state.updatedAt ||
             next.audioQueueRevision !== model.state.audioQueueRevision;
           model.state = next;
           reconcilePendingSpeechPatch();
           if (!readingPositionRestored) {
             const saved = readReadingPosition();
             model.chapterId = saved?.chapterId || null;
             model.unitId = saved?.unitId || null;
             model.selectedVersionId = saved?.selectedVersionId || null;
             readingPositionRestored = true;
           }
           if (!currentChapter()) {
             model.chapterId =
               next.parts[0]?.chapters[0]?.id || next.defaultChapterId;
           }
           const current = currentChapter();
           if (
             !current?.sections?.some((unit) => unit.unit_id === model.unitId)
           ) {
             const preferred =
               current.sections?.find((unit) => unit.preview) ||
               current.sections?.find((unit) => unit.status !== "planned") ||
              current.sections?.[0];
            model.unitId = preferred?.unit_id || null;
          }
          const unit = currentUnit();
          if (
            model.selectedVersionId &&
            !unit?.versions?.some(
              (version) => version.id === model.selectedVersionId
            )
           ) {
             model.selectedVersionId = null;
           }
           saveReadingPosition();
           if (shouldRender) render();
        } catch {
          el("updated").textContent = "读取失败";
        }
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
