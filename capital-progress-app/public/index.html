<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="《资本论》第一卷通俗新译的本地目录、状态、版本与正文。"
    />
    <title>《资本论》第一卷 · 翻译目录</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("capital-progress-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3f0e9;
        --surface: #fbfaf7;
        --ink: #24211d;
        --muted: #746f67;
        --faint: #a49e94;
        --line: #ded9cf;
        --accent: #983d32;
        --accent-soft: #f1e3df;
        --green: #3e6956;
        --green-soft: #e5eee9;
        --blue: #4c6378;
        --blue-soft: #e7edf1;
        --catalog: rgba(247, 245, 240, 0.78);
        --hover: rgba(36, 33, 29, 0.045);
        --selected: #ebe6dd;
        --status-bg: #ece8e0;
        --active-surface: #f3efe8;
        --control-border-hover: #b7aea2;
        --dot: #c8c2b8;
        --note-line: #c7b49b;
        --note-ink: #665c50;
        --diff-remove-bg: #f6ded9;
        --diff-remove-ink: #83352d;
        --diff-add-bg: #dfece5;
        --diff-add-ink: #2f614b;
        --footnote-highlight: rgba(207, 179, 102, 0.22);
        --shadow: rgba(43, 36, 29, 0.16);
        --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
        --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #171614;
        --surface: #201e1b;
        --ink: #e8e3da;
        --muted: #aaa39a;
        --faint: #817a72;
        --line: #39342f;
        --accent: #dc7869;
        --accent-soft: #3c2521;
        --green: #84b79d;
        --green-soft: #21342b;
        --blue: #90aec6;
        --blue-soft: #243440;
        --catalog: rgba(27, 25, 22, 0.88);
        --hover: rgba(255, 255, 255, 0.055);
        --selected: #302c27;
        --status-bg: #302c27;
        --active-surface: #2b2824;
        --control-border-hover: #655e56;
        --dot: #5f5952;
        --note-line: #826f58;
        --note-ink: #c1b5a6;
        --diff-remove-bg: #4a2825;
        --diff-remove-ink: #f1aea4;
        --diff-add-bg: #243c31;
        --diff-add-ink: #a9d6bf;
        --footnote-highlight: rgba(207, 179, 102, 0.18);
        --shadow: rgba(0, 0, 0, 0.42);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
      }

      button { font: inherit; }
      .shell { width: min(1500px, 100%); margin: 0 auto; padding: 24px 28px 48px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 52px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: baseline; gap: 11px; }
      .brand strong { font: 600 18px/1 var(--serif); letter-spacing: 0.04em; }
      .brand span { color: var(--muted); font-size: 13px; }
      .top-actions { display: flex; align-items: center; gap: 14px; }
      .updated { color: var(--faint); font-size: 12px; white-space: nowrap; }
      .theme-toggle {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--control-border-hover);
        color: var(--ink);
        background: var(--hover);
      }

      .overview {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        padding: 30px 0 24px;
      }
      .overview h1 {
        margin: 0;
        font: 600 clamp(29px, 4vw, 46px)/1.12 var(--serif);
        letter-spacing: -0.03em;
      }
      .stats { display: flex; gap: 28px; }
      .stat { min-width: 64px; }
      .stat strong { display: block; font: 600 24px/1 var(--serif); }
      .stat span { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
        min-height: 720px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .workspace.catalog-collapsed { grid-template-columns: minmax(0, 1fr); }
      .workspace.catalog-collapsed .catalog { display: none; }
      .catalog {
        min-width: 0;
        min-height: 720px;
        border-right: 1px solid var(--line);
        background: var(--catalog);
      }
      .catalog-toolbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 18px 0 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .catalog-toolbar strong {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .catalog-control,
      .catalog-expand {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        cursor: pointer;
      }
      .catalog-control:hover,
      .catalog-expand:hover {
        border-color: var(--line);
        color: var(--ink);
        background: var(--hover);
      }
      .catalog-control::before,
      .catalog-expand::before {
        width: 6px;
        height: 6px;
        border-bottom: 1px solid currentColor;
        border-left: 1px solid currentColor;
        content: "";
        transform: rotate(45deg);
      }
      .catalog-expand { display: none; }
      .catalog-expand::before {
        border: 0;
        border-top: 1px solid currentColor;
        border-right: 1px solid currentColor;
      }
      .workspace.catalog-collapsed .catalog-expand { display: inline-flex; }
      .part { padding: 19px 14px 12px; border-bottom: 1px solid var(--line); }
      .part:last-child { border-bottom: 0; }
      .part-title {
        margin: 0 8px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .chapter {
        width: 100%;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        align-items: start;
        gap: 10px;
        padding: 11px 9px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .chapter:hover { background: var(--hover); }
      .chapter.selected { background: var(--selected); }
      .chapter-no {
        padding-top: 2px;
        color: var(--faint);
        font: 500 12px/1 var(--serif);
        font-variant-numeric: tabular-nums;
      }
      .chapter-copy { min-width: 0; }
      .chapter-title {
        display: block;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chapter-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px 8px;
        margin-top: 5px;
        color: var(--faint);
        font-size: 10px;
        line-height: 1.4;
      }
      .chapter-meta + .chapter-meta { margin-top: 2px; }
      .catalog-fact {
        white-space: nowrap;
      }
      .catalog-fact.problem { color: var(--accent); }
      .catalog-fact.active { color: var(--blue); }
      .catalog-fact.ready { color: var(--green); }
      .catalog-fact::after {
        margin-left: 8px;
        color: var(--line);
        content: "·";
      }
      .catalog-fact:last-child::after { display: none; }
      .catalog-fact-label {
        margin-right: 3px;
        color: var(--muted);
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
      .dot.completed { background: var(--green); }
      .dot.in_progress { background: var(--accent); }
      .dot.source_ready { background: var(--blue); }
      .chapter-sections {
        display: grid;
        gap: 2px;
        margin: 3px 0 7px 30px;
        padding-left: 9px;
        border-left: 1px solid var(--line);
      }
      .catalog-section {
        width: 100%;
        display: block;
        padding: 8px 9px;
        border: 0;
        border-radius: 4px;
        color: var(--muted);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .catalog-section:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .catalog-section.selected {
        color: var(--ink);
        background: var(--active-surface);
      }
      .catalog-section-copy {
        min-width: 0;
      }
      .catalog-section strong {
        display: block;
        overflow: hidden;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .catalog-section small {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        margin-top: 3px;
        color: var(--faint);
        font-size: 10px;
        line-height: 1.4;
      }
      .catalog-section small + small { margin-top: 1px; }
      .catalog-section .catalog-fact {
        overflow: hidden;
        max-width: 100%;
        text-overflow: ellipsis;
      }

      .content { min-width: 0; background: var(--surface); }
      .chapter-head {
        padding: 38px 46px 26px;
        border-bottom: 1px solid var(--line);
      }
      .chapter-context {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 28px;
        margin-bottom: 8px;
      }
      .chapter-part {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .chapter-head h2 {
        margin: 0;
        font: 600 clamp(25px, 3vw, 38px)/1.22 var(--serif);
        letter-spacing: -0.025em;
      }
      .chapter-summary {
        display: flex;
        align-items: center;
        gap: 10px 18px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--status-bg);
      }
      .status.completed { color: var(--green); background: var(--green-soft); }
      .status.in_progress { color: var(--accent); background: var(--accent-soft); }
      .status.source_ready { color: var(--blue); background: var(--blue-soft); }

      .reader-nav {
        display: flex;
        gap: 22px;
        padding: 0 46px;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        padding: 15px 0 13px;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        cursor: pointer;
      }
      .tab.active { color: var(--ink); border-color: var(--accent); }

      .reader { min-height: 510px; padding: 40px 46px 64px; }
      .reader-inner { max-width: 760px; margin: 0 auto; }
      .reader-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      .reader-title h3 { margin: 0; font: 600 19px/1.3 var(--serif); }
      .version-tag { color: var(--muted); font-size: 11px; }
      .version-tools { display: flex; align-items: center; gap: 8px; }
      .small-action {
        min-height: 31px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: transparent;
        font: 11px/1 var(--sans);
      }
      .small-action {
        padding: 0 10px;
        white-space: nowrap;
        cursor: pointer;
      }
      .small-action:hover {
        border-color: var(--control-border-hover);
        background: var(--active-surface);
      }
      .small-action.active {
        border-color: var(--control-border-hover);
        color: var(--ink);
        background: var(--active-surface);
      }
      .version-picker { position: relative; min-width: 116px; }
      .version-trigger {
        width: 100%;
        min-height: 31px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 9px 0 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: var(--surface);
        font: 11px/1 var(--sans);
        cursor: pointer;
      }
      .version-trigger::after {
        width: 6px;
        height: 6px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(45deg) translateY(-2px);
      }
      .version-trigger[aria-expanded="true"] {
        border-color: var(--control-border-hover);
      }
      .version-trigger[aria-expanded="true"]::after {
        transform: rotate(225deg) translate(-1px, -1px);
      }
      .version-menu {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        right: 0;
        min-width: 170px;
        max-height: 260px;
        padding: 5px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 12px 32px var(--shadow);
      }
      .version-menu[hidden] { display: none; }
      .version-option {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 9px 10px;
        border: 0;
        border-radius: 4px;
        color: var(--ink);
        background: transparent;
        font: 11px/1.3 var(--sans);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .version-option:hover,
      .version-option[aria-selected="true"] { background: var(--active-surface); }
      .version-option small { color: var(--green); font-size: 10px; }
      .adopted-mark { color: var(--green); font-size: 11px; white-space: nowrap; }
      .audio-manager {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: -14px 0 28px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .audio-manager-main,
      .audio-manager-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .audio-manager-main { min-width: 0; }
      .audio-manager-actions { justify-content: flex-end; }
      .audio-manager .version-picker { min-width: 142px; }
      .audio-manager .audio-model-picker { min-width: 152px; }
      .audio-manager-label {
        color: var(--muted);
        font: 11px/1.4 var(--sans);
        white-space: nowrap;
      }
      .audio-operation {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        color: var(--muted);
        font: 12px/1.5 var(--sans);
      }
      .audio-operation.failed { color: var(--accent); }
      .audio-operation.ready { color: var(--green); }
      .audio-operation-detail {
        overflow-wrap: anywhere;
      }
      .audio-generation-plan {
        flex: 1 0 100%;
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(in srgb, var(--surface) 86%, var(--paper));
        color: var(--muted);
        font: 12px/1.6 var(--sans);
      }
      .audio-generation-plan strong { color: var(--ink); }
      .audio-generation-plan-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .audio-publish-state {
        color: var(--muted);
        font: 11px/1.4 var(--sans);
        white-space: nowrap;
      }
      .audio-publish-state[data-status="published"] { color: var(--green); }
      .audio-publish-state[data-status="uploading"],
      .audio-publish-state[data-status="queued"] { color: var(--blue); }
      .audio-publish-state[data-status="failed"],
      .audio-publish-state[data-status="interrupted"] { color: var(--accent); }
      .speech-patch-panel {
        display: grid;
        gap: 14px;
        margin: -15px 0 28px;
        padding: 17px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 82%, var(--paper));
      }
      .speech-patch-heading,
      .speech-patch-actions,
      .speech-patch-impact {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .speech-patch-heading strong { font: 600 13px/1.4 var(--sans); }
      .speech-patch-heading span,
      .speech-patch-impact,
      .speech-patch-hint {
        color: var(--muted);
        font: 11px/1.55 var(--sans);
      }
      .speech-patch-source {
        margin: 0;
        color: var(--ink);
        font: 13px/1.7 var(--sans);
      }
      .speech-patch-field {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font: 11px/1.4 var(--sans);
      }
      .speech-patch-field textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: none;
        color: var(--ink);
        background: var(--paper);
        font: 14px/1.7 var(--sans);
      }
      .speech-patch-field textarea:focus {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--line));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 11%, transparent);
      }
      .speech-patch-actions { justify-content: flex-end; }
      .speech-patch-error { color: var(--accent); font: 11px/1.5 var(--sans); }
      .prose.speech-patch-mode [data-narration-sentence] {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 76%, transparent);
      }
      .prose.speech-patch-mode [data-narration-sentence]:hover {
        box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, var(--ink));
      }
      .prose { font: 400 17px/1.95 var(--serif); }
      .prose h1 { margin: 0 0 32px; font-size: 25px; line-height: 1.35; }
      .prose h2 { margin: 38px 0 20px; font-size: 21px; line-height: 1.4; }
      .prose h3 { margin: 30px 0 16px; font-size: 18px; line-height: 1.5; }
      .prose h4,
      .prose h5,
      .prose h6 {
        margin: 25px 0 13px;
        font-size: 16px;
        line-height: 1.55;
      }
      .prose p { margin: 0 0 1.18em; }
      .prose a {
        color: var(--blue);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .prose strong { font-weight: 650; }
      .prose .math-inline,
      .prose .math-display {
        font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
        font-style: italic;
      }
      .prose .math-inline {
        display: inline-flex;
        align-items: center;
        gap: 0.04em;
        white-space: nowrap;
      }
      .prose .math-display {
        margin: 1.35em 0;
        overflow-x: auto;
        text-align: center;
        font-size: 1.08em;
      }
      .prose .math-text {
        font-family: var(--serif);
        font-style: normal;
      }
      .prose .math-frac {
        display: inline-grid;
        grid-template-rows: auto auto;
        margin: 0 0.08em;
        vertical-align: middle;
        line-height: 1;
        text-align: center;
      }
      .prose .math-frac > span {
        padding: 0 0.12em;
        font-size: 0.78em;
      }
      .prose .math-frac > span:first-child {
        padding-bottom: 0.08em;
        border-bottom: 1px solid currentColor;
      }
      .prose .math-frac > span:last-child { padding-top: 0.08em; }
      .prose ul,
      .prose ol { margin: 0 0 1.2em; padding-left: 1.7em; }
      .prose li { margin: 0.25em 0; padding-left: 0.15em; }
      .prose blockquote {
        margin: 1.35em 0;
        padding: 0.1em 0 0.1em 1.15em;
        border-left: 2px solid var(--note-line);
        color: var(--muted);
      }
      .prose blockquote p:last-child { margin-bottom: 0; }
      .prose code {
        padding: 0.12em 0.32em;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--catalog);
        font: 0.88em/1.5 Consolas, "SFMono-Regular", monospace;
      }
      .prose pre {
        margin: 1.35em 0;
        padding: 15px 17px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--catalog);
      }
      .prose pre code {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 13px;
        white-space: pre;
      }
      .prose hr {
        margin: 2em 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .prose .table-wrap {
        margin: 1.35em 0;
        overflow-x: auto;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        font: 14px/1.65 var(--sans);
      }
      .prose th,
      .prose td {
        padding: 9px 11px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .prose th {
        background: var(--catalog);
        font-weight: 600;
      }

      .versions { display: grid; gap: 10px; }

  <body>

    <audio id="narrationAudio" preload="metadata"></audio>
    <section

    >
      <div class="narration-progress-row">

    <script>
      const model = {
        state: null,
        chapterId: null,
        unitId: null,
        selectedVersionId: null,
        view: "text",
        compareMode: false,
        compareBaseVersionId: null,
        compareTargetVersionId: null,
        diffOnly: false,
        diffMode: "inline",
        audioModelSelections: {},
        audioVersionSelections: {},
        audioGenerationPlan: null,
        speechPatch: {
          active: false,
          unitId: "",
          translationVersionId: "",
          baseAudioVersionId: "",
          selectedSentenceId: "",
          draft: "",
          error: "",
          submitting: false,
        },
        pendingSpeechPatch: null,
        speechPatchNotice: null,
      };
      const el = (id) => document.getElementById(id);
      const themeQuery = matchMedia("(prefers-color-scheme: dark)");
      const catalogPreferenceKey = "capital-progress-catalog-collapsed";
      const readingPositionKey = "capital-progress-reading-position";
      let readingPositionRestored = false;
      const narration = {
        manifest: null,
        key: "",
        loadingKey: "",
        loadingPromise: null,
        loadToken: 0,
        activeSentenceId: "",
        activeChunkId: "",
        elapsedMs: 0,
        started: false,
        playing: false,
        pendingStart: null,
        decorated: [],
        prefetched: new Set(),
      };
      const narrationSentencePattern = /[^。！？!?]+(?:[。！？!?]+[”’」』》）)]*)|[^。！？!?]+$/g;
      const narrationMaximumCharacters = 220;

      function readReadingPosition() {
        try {
          return JSON.parse(localStorage.getItem(readingPositionKey) || "null");
        } catch {
          return null;
        }
      }

      function saveReadingPosition() {
        try {
          localStorage.setItem(
            readingPositionKey,
            JSON.stringify({
              chapterId: model.chapterId,
              unitId: model.unitId,
              selectedVersionId: model.selectedVersionId,
            })
          );
        } catch {}
      }

      function updateThemeToggle() {
        const isDark = document.documentElement.dataset.theme === "dark";
        const button = el("themeToggle");
        button.textContent = isDark ? "浅色" : "深色";
        button.setAttribute(
          "aria-label",
          isDark ? "切换到浅色模式" : "切换到深色模式"
        );
        button.setAttribute("aria-pressed", String(isDark));
      }

      function setTheme(theme, persist = false) {
        document.documentElement.dataset.theme = theme;
        if (persist) {
          try {
            localStorage.setItem("capital-progress-theme", theme);
          } catch {}
        }
        updateThemeToggle();
      }

      function setCatalogCollapsed(collapsed, persist = false) {
        el("workspace").classList.toggle("catalog-collapsed", collapsed);
        const collapseButton = el("catalogCollapse");
        const expandButton = el("catalogExpand");
        collapseButton?.setAttribute("aria-expanded", String(!collapsed));
        expandButton?.setAttribute("aria-expanded", String(!collapsed));
        if (persist) {
          try {
            localStorage.setItem(catalogPreferenceKey, String(collapsed));
          } catch {}
        }
      }

      function escapeHtml(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }

      function safeMarkdownId(value = "") {
        return String(value)
          .trim()
          .replace(/[^A-Za-z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "") || "note";
      }

      function safeMarkdownUrl(value = "") {
        const url = String(value).trim();
        return /^(?:https?:|mailto:|#|\/(?!\/)|\.{1,2}\/)/i.test(url)
          ? escapeHtml(url)
          : "";
      }

      function renderMathContent(value = "") {
        let output = escapeHtml(String(value).trim());
        output = output
          .replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            '<span class="math-frac"><span>$1</span><span>$2</span></span>'
          )
          .replace(/\\text\{([^{}]*)\}/g, '<span class="math-text">$1</span>')
          .replace(/\\times/g, "×")
          .replace(/\\cdot/g, "·")
          .replace(/\\Delta/g, "Δ")
          .replace(/\\%/g, "%")
          .replace(/\\,/g, " ")
          .replace(/\{,\}/g, ",")
          .replace(/[{}]/g, "");
        return output;
      }

      function renderInlineMarkdown(value = "", context = {}) {
        const tokens = [];
        const stash = (html) => {
          tokens.push(html);
          return `\u0000${tokens.length - 1}\u0000`;
        };
        let output = String(value);

        output = output.replace(/`([^`\n]+)`/g, (_, code) =>
          stash(`<code>${escapeHtml(code)}</code>`)
        );
        output = output.replace(/\\\((.+?)\\\)/g, (_, expression) =>
          stash(
            `<span class="math-inline" role="math">${renderMathContent(expression)}</span>`
          )
        );
        output = escapeHtml(output);
        output = output.replace(
          /!\[([^\]]*)\]\((\S+?)(?:\s+&quot;[^&]*&quot;)?\)/g,
          (_, alt, target) => {
            const url = safeMarkdownUrl(target);
            return url
              ? stash(`<img src="${url}" alt="${alt}" loading="lazy">`)
              : alt;
          }
        );
        output = output.replace(
          /\[([^\]]+)\]\((\S+?)(?:\s+&quot;[^&]*&quot;)?\)/g,
          (_, label, target) => {
            const url = safeMarkdownUrl(target);
            return url
              ? stash(`<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`)
              : label;
          }
        );
        output = output.replace(/\[\^([^\]]+)\]/g, (_, label) => {
          const id = safeMarkdownId(label);
          const counts = context.referenceCounts || new Map();
          context.referenceCounts = counts;
          const count = (counts.get(id) || 0) + 1;
          counts.set(id, count);
          return stash(
            `<sup id="fnref-${id}-${count}"><a href="#fn-${id}">${escapeHtml(label)}</a></sup>`
          );
        });
        output = output
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
          .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
          .replace(/(^|[^\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
          .replace(/(^|[^\w])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");

        return output.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[index]);
      }

      function markdownTableRow(line = "") {
        return line
          .trim()
          .replace(/^\||\|$/g, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function isMarkdownTableDivider(line = "") {
        const cells = markdownTableRow(line);
        return cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
      }

      function renderMarkdown(value = "") {
        const normalized = String(value).replace(/\r\n?/g, "\n").trim();
        if (!normalized) return "";

        const sourceLines = normalized.split("\n");
        const lines = [];
        const footnotes = new Map();
        for (let index = 0; index < sourceLines.length; index += 1) {
          const definition = sourceLines[index].match(/^\[\^([^\]]+)\]:\s*(.*)$/);
          if (!definition) {
            lines.push(sourceLines[index]);
            continue;
          }
          const body = [definition[2]];
          while (index + 1 < sourceLines.length) {
            const nextLine = sourceLines[index + 1];
            if (/^(?: {2,}|\t)\S/.test(nextLine)) {
              index += 1;
              body.push(sourceLines[index].replace(/^(?: {2,}|\t)/, ""));
              continue;
            }
            if (!nextLine.trim()) {
              let lookahead = index + 2;
              while (
                lookahead < sourceLines.length &&
                !sourceLines[lookahead].trim()
              ) {
                lookahead += 1;
              }
              if (
                lookahead < sourceLines.length &&
                /^(?: {2,}|\t)\S/.test(sourceLines[lookahead])
              ) {
                index += 1;
                body.push("");
                continue;
              }
            }
            break;
          }
          footnotes.set(definition[1], body.join("\n").trim());
          lines.push("");
        }

        const context = { referenceCounts: new Map() };
        const output = [];
        const isBlockStart = (index) => {
          const line = lines[index] || "";
          const next = lines[index + 1] || "";
          return (
            /^ {0,3}(?:#{1,6}\s|```|>|[-+*]\s+|\d+[.)]\s+)/.test(line) ||
            /^ {0,3}(?:[-*_]\s*){3,}$/.test(line) ||
            (line.includes("|") && isMarkdownTableDivider(next))
          );
        };

        for (let index = 0; index < lines.length;) {
          const line = lines[index];
          if (!line.trim()) {
            index += 1;
            continue;
          }

          const fence = line.match(/^ {0,3}```([\w-]*)\s*$/);
          if (fence) {
            const code = [];
            index += 1;
            while (index < lines.length && !/^ {0,3}```\s*$/.test(lines[index])) {
              code.push(lines[index]);
              index += 1;
            }
            if (index < lines.length) index += 1;
            const language = fence[1]
              ? ` class="language-${escapeHtml(fence[1])}"`
              : "";
            output.push(
              `<pre><code${language}>${escapeHtml(code.join("\n"))}</code></pre>`
            );
            continue;
          }

          const heading = line.match(/^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
          if (heading) {
            const level = heading[1].length;
            output.push(
              `<h${level}>${renderInlineMarkdown(heading[2], context)}</h${level}>`
            );
            index += 1;
            continue;
          }

          if (/^ {0,3}(?:[-*_]\s*){3,}$/.test(line)) {
            output.push("<hr>");
            index += 1;
            continue;
          }

          if (line.trim() === "\\[") {
            const formula = [];
            index += 1;
            while (index < lines.length && lines[index].trim() !== "\\]") {
              formula.push(lines[index].trim());
              index += 1;
            }
            if (index < lines.length) index += 1;
            output.push(
              `<div class="math-display" role="math">${renderMathContent(
                formula.join(" ")
              )}</div>`
            );
            continue;
          }

          if (line.includes("|") && isMarkdownTableDivider(lines[index + 1] || "")) {
            const headers = markdownTableRow(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].trim().includes("|")) {
              rows.push(markdownTableRow(lines[index]));
              index += 1;
            }
            output.push(
              `<div class="table-wrap"><table><thead><tr>${
                headers.map((cell) =>
                  `<th>${renderInlineMarkdown(cell, context)}</th>`
                ).join("")
              }</tr></thead><tbody>${
                rows.map((row) =>
                  `<tr>${headers.map((_, cellIndex) =>
                    `<td>${renderInlineMarkdown(row[cellIndex] || "", context)}</td>`
                  ).join("")}</tr>`
                ).join("")
              }</tbody></table></div>`
            );
            continue;
          }

          const quote = line.match(/^ {0,3}>\s?(.*)$/);
          if (quote) {
            const quoteLines = [];
            while (index < lines.length) {
              const current = lines[index].match(/^ {0,3}>\s?(.*)$/);
              if (!current) break;
              quoteLines.push(current[1]);
              index += 1;
            }
            output.push(
              `<blockquote><p>${renderInlineMarkdown(
                quoteLines.join(" "),
                context
              )}</p></blockquote>`
            );
            continue;
          }

          const listItem = line.match(/^ {0,3}(?:([-+*])|(\d+)[.)])\s+(.+)$/);
          if (listItem) {
            const ordered = Boolean(listItem[2]);
            const tag = ordered ? "ol" : "ul";
            const items = [];
            while (index < lines.length) {
              const current = lines[index].match(
                /^ {0,3}(?:([-+*])|(\d+)[.)])\s+(.+)$/
              );
              if (!current || Boolean(current[2]) !== ordered) break;
              items.push(current[3]);
              index += 1;
            }
            output.push(
              `<${tag}>${items.map((item) =>
                `<li>${renderInlineMarkdown(item, context)}</li>`
              ).join("")}</${tag}>`
            );
            continue;
          }

          const paragraph = [];
          while (
            index < lines.length &&
            lines[index].trim() &&
            (paragraph.length === 0 || !isBlockStart(index))
          ) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          const text = paragraph.join(" ");
          const className = text.startsWith("〔译者注：")
            ? ' class="translator-note"'
            : "";
          output.push(
            `<p${className}>${renderInlineMarkdown(text, context)}</p>`
          );
        }

        if (footnotes.size) {
          output.push(
            `<section class="footnotes" aria-label="脚注"><hr><ol>${
              Array.from(footnotes, ([label, body]) => {
                const id = safeMarkdownId(label);
                const backref = context.referenceCounts.has(id)
                  ? `<a class="footnote-backref" href="#fnref-${id}-1" aria-label="返回正文">↩</a>`
                  : "";
                const isBlock = /\n\s*\n/.test(body) ||
                  body.split("\n").some((line, index, all) =>
                    line.includes("|") && isMarkdownTableDivider(all[index + 1] || "")
                  );
                const renderedBody = isBlock
                  ? `<div class="footnote-text is-block">${renderMarkdown(body)}</div>`
                  : `<span class="footnote-text">${renderInlineMarkdown(
                      body.replace(/\n+/g, " "),
                      context
                    )}</span>`;
                return `<li id="fn-${id}"><span class="footnote-number">${escapeHtml(label)}.</span><div class="footnote-body">${renderedBody}${backref}</div></li>`;
              }).join("")
            }</ol></section>`
          );
        }

        return output.join("");
      }

      function stripLeadingDocumentHeadings(value = "") {
        return value
          .trimStart()
          .replace(/^(?:#{1,2}\s+[^\n]+\n\s*)+/, "")
          .trimStart();
      }

      function renderVersionPicker({
        id,
        versions,
        selectedId,
        action,
        label,
      }) {
        const selected = versions.find((version) => version.id === selectedId)
          || versions[0];
        return `
          <div class="version-picker" data-version-picker="${escapeHtml(id)}">
            <button
              class="version-trigger"
              type="button"
              data-picker-trigger="${escapeHtml(id)}"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="${escapeHtml(label)}"
            >
              <span>${escapeHtml(selected?.label || "选择版本")}</span>
            </button>
            <div
              class="version-menu"
              data-picker-menu="${escapeHtml(id)}"
              role="listbox"
              aria-label="${escapeHtml(label)}"
              hidden
            >
              ${versions.map((version) => `
                <button
                  class="version-option"
                  type="button"
                  role="option"
                  aria-selected="${version.id === selected?.id}"
                  data-picker-action="${escapeHtml(action)}"
                  data-picker-value="${escapeHtml(version.id)}"
                >
                  <span>${escapeHtml(version.label)}</span>
                  ${version.adopted ? "<small>已采用</small>" : ""}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }

      function diffArray(left, right) {
        const rows = Array.from(
          { length: left.length + 1 },
          () => new Uint16Array(right.length + 1)
        );
        for (let i = left.length - 1; i >= 0; i -= 1) {
          for (let j = right.length - 1; j >= 0; j -= 1) {
            rows[i][j] =
              left[i] === right[j]
                ? rows[i + 1][j + 1] + 1
                : Math.max(rows[i + 1][j], rows[i][j + 1]);
          }
        }

        const result = [];
        let i = 0;
        let j = 0;
        while (i < left.length && j < right.length) {
          if (left[i] === right[j]) {
            result.push({ type: "equal", value: left[i] });
            i += 1;
            j += 1;
          } else if (rows[i + 1][j] >= rows[i][j + 1]) {
            result.push({ type: "remove", value: left[i] });
            i += 1;
          } else {
            result.push({ type: "add", value: right[j] });
            j += 1;
          }
        }
        while (i < left.length) {
          result.push({ type: "remove", value: left[i] });
          i += 1;
        }
        while (j < right.length) {
          result.push({ type: "add", value: right[j] });
          j += 1;
        }
        return result;
      }

      const wordSegmenter =
        typeof Intl.Segmenter === "function"
          ? new Intl.Segmenter("zh-CN", { granularity: "word" })
          : null;

      function tokenizeForDiff(value) {
        if (wordSegmenter) {
          return Array.from(
            wordSegmenter.segment(value),
            (segment) => segment.segment
          );
        }
        return value.match(/[A-Za-z0-9]+|[\u3400-\u9fff]|[^\u3400-\u9fffA-Za-z0-9]/gu)
          || [];
      }

      function wordDiffMarkup(left, right) {
        const operations = diffArray(
          tokenizeForDiff(left),
          tokenizeForDiff(right)
        );
        let html = "";
        let type = "";
        let buffer = "";
        const flush = () => {
          if (!buffer) return;
          const escaped = escapeHtml(buffer);
          html +=
            type === "remove"
              ? `<del>${escaped}</del>`
              : type === "add"
                ? `<ins>${escaped}</ins>`
                : escaped;
          buffer = "";
        };
        operations.forEach((operation) => {
          if (operation.type !== type) {
            flush();
            type = operation.type;
          }
          buffer += operation.value;
        });
        flush();
        return html;
      }

      function describeDiffBlock(value) {
        const text = value.trim();
        const heading = text.match(/^(#{1,2})\s+([\s\S]*)$/);
        if (heading) {
          return {
            tag: heading[1].length === 1 ? "h1" : "h2",
            text: heading[2],
            extraClass: "",
          };
        }
        return {
          tag: "p",
          text,
          extraClass: text.startsWith("〔译者注：") ? " translator-note" : "",
        };
      }

      function renderDiffBlock(left, right, state) {
        const source = right || left;
        const descriptor = describeDiffBlock(source);
        let contents = "";
        if (state === "changed") {
          const oldBlock = describeDiffBlock(left);
          const newBlock = describeDiffBlock(right);
          contents = wordDiffMarkup(oldBlock.text, newBlock.text);
        } else if (state === "removed") {
          contents = `<del>${escapeHtml(descriptor.text)}</del>`;
        } else if (state === "added") {
          contents = `<ins>${escapeHtml(descriptor.text)}</ins>`;
        } else {
          contents = escapeHtml(descriptor.text);
        }
        return `<${descriptor.tag} class="diff-block ${state}${descriptor.extraClass}">${contents}</${descriptor.tag}>`;
      }

      function renderVersionDiff(leftValue, rightValue, onlyChanges, mode) {
        const leftBlocks = stripLeadingDocumentHeadings(leftValue)
          .split(/\n{2,}/)
          .map((block) => block.trim())
          .filter(Boolean);
        const rightBlocks = stripLeadingDocumentHeadings(rightValue)
          .split(/\n{2,}/)
          .map((block) => block.trim())
          .filter(Boolean);
        const operations = diffArray(leftBlocks, rightBlocks);
        const output = [];
        let removed = [];
        let added = [];

        const flushChanges = () => {
          if (mode === "paragraph") {
            const blockCount = Math.max(removed.length, added.length);
            for (let index = 0; index < blockCount; index += 1) {
              if (removed[index]) {
                output.push(
                  renderDiffBlock(removed[index], "", "removed")
                );
              }
              if (added[index]) {
                output.push(
                  renderDiffBlock("", added[index], "added")
                );
              }
            }
            removed = [];
            added = [];
            return;
          }
          const pairCount = Math.min(removed.length, added.length);
          for (let index = 0; index < pairCount; index += 1) {
            output.push(
              renderDiffBlock(removed[index], added[index], "changed")
            );
          }
          removed.slice(pairCount).forEach((block) => {
            output.push(renderDiffBlock(block, "", "removed"));
          });
          added.slice(pairCount).forEach((block) => {
            output.push(renderDiffBlock("", block, "added"));
          });
          removed = [];
          added = [];
        };

        operations.forEach((operation) => {
          if (operation.type === "equal") {
            flushChanges();
            if (!onlyChanges) {
              output.push(
                renderDiffBlock(operation.value, operation.value, "unchanged")
              );
            }
          } else if (operation.type === "remove") {
            removed.push(operation.value);
          } else {
            added.push(operation.value);
          }
        });
        flushChanges();
        return output.join("")
          || '<div class="empty">这两个版本没有文字差异。</div>';
      }

      function comparisonPair(unit) {
        const versions = unit?.versions || [];
        const target =
          versions.find((version) => version.id === model.compareTargetVersionId)
          || displayedVersion(unit)
          || versions[0];
        const targetNumber = Number(target?.number || 0);
        const base =
          versions
            .filter((version) => version.id !== target?.id)
            .sort((a, b) => {
              const aDistance = Math.abs(Number(a.number || 0) - targetNumber);
              const bDistance = Math.abs(Number(b.number || 0) - targetNumber);
              return aDistance - bDistance;
            })[0]
          || target;
        const selectedBase =
          versions.find(
            (version) =>
              version.id === model.compareBaseVersionId
              && version.id !== target?.id
          )
          || base;
        model.compareBaseVersionId = selectedBase?.id || null;
        model.compareTargetVersionId = target?.id || null;
        return { base: selectedBase, target };
      }

      function dateText(value) {
        if (!value) return "—";
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Asia/Shanghai",
        }).format(new Date(value));
      }

      function allChapters() {
        return [
          ...(model.state.frontMatter || []).map((chapter) => ({
            ...chapter,
            partId: "front-matter",
            partNumber: 0,
            partTitle: "序言",
          })),
          ...model.state.parts.flatMap((part) =>
            part.chapters.map((chapter) => ({
              ...chapter,
              partId: part.id,
              partNumber: part.number,
              partTitle: part.title,
            }))
          ),
        ];
      }

      function allUnits() {
        return allChapters().flatMap((chapter) => chapter.sections || []);
      }

      function currentChapter() {
        return allChapters().find((chapter) => chapter.id === model.chapterId);
      }

      function currentUnit() {
        const chapter = currentChapter();
        return chapter?.sections?.find((unit) => unit.unit_id === model.unitId);
      }

      function displayedVersion(unit = currentUnit()) {
        if (!unit?.versions?.length) return null;
        return (
          unit.versions.find(
            (version) => version.id === model.selectedVersionId
          ) ||
          unit.versions.find(
            (version) => version.id === unit.adoptedVersionId
          ) ||
          unit.versions[0]
        );
      }

      function audioSelectionKey(unit, version) {
        return `${unit?.unit_id || ""}:${version?.id || ""}`;
      }

      function selectedAudioModel(unit, version) {
        const models = version?.audio?.models || [];
        const key = audioSelectionKey(unit, version);
        const selectedId = model.audioModelSelections[key];
        const selected = models.find((item) => item.id === selectedId);
        if (selected) return selected;
        return models.find((item) => item.canGenerate) || models[0] || null;
      }

      function selectedAudioVersion(unit, version) {
        const versions = (version?.audio?.versions || []).filter(
          (item) => item.status === "ready"
        );
        const key = audioSelectionKey(unit, version);
        const selectedId = model.audioVersionSelections[key];
        return (
          versions.find((item) => item.id === selectedId) ||
          versions.find((item) => item.adopted) ||
          versions[0] ||
          null
        );
      }

      function speechPatchStatusFor(unit, version) {
        const generation = version?.audio?.generation;
        const notice = model.speechPatchNotice;
        if (
          notice?.unitId === unit?.unit_id &&
          notice?.translationVersionId === version?.id
        ) {
          return notice;
        }
        if (generation?.operation === "patch") {
          return {
            unitId: unit?.unit_id,
            translationVersionId: version?.id,
            status: generation.status,
            label: generation.label,
            detail: generation.error || "只会重新生成所选句子所在的分块。",
          };
        }
        return null;
      }

      function normalizeNarrationText(value = "") {
        return String(value).replace(/\s+/g, " ").trim();
      }

      function rawNarrationSentenceRanges(value) {
        const ranges = [];
        for (const match of value.matchAll(narrationSentencePattern)) {
          let start = match.index || 0;
          const end = start + match[0].length;
          while (end - start > narrationMaximumCharacters) {
            const windowEnd = Math.min(
              end,
              start + narrationMaximumCharacters + 1
            );
            const windowText = value.slice(start, windowEnd);
            let cut = -1;
            ["；", ";", "：", ":", "，", ","].forEach((punctuation) => {
              cut = Math.max(cut, windowText.lastIndexOf(punctuation));
            });
            cut =
              cut < Math.floor(narrationMaximumCharacters * 0.55)
                ? narrationMaximumCharacters
                : cut + 1;
            ranges.push({
              start,
              end: start + cut,
              text: normalizeNarrationText(value.slice(start, start + cut)),
            });
            start += cut;
            while (/\s/.test(value[start] || "")) start += 1;
          }
          if (normalizeNarrationText(value.slice(start, end))) {
            ranges.push({
              start,
              end,
              text: normalizeNarrationText(value.slice(start, end)),
            });
          }
        }
        return ranges;
      }

      function clearNarrationDecoration() {
        narration.decorated.forEach((span) => {
          if (span.isConnected) span.replaceWith(span.textContent || "");
        });
        narration.decorated = [];
        document.querySelector(".prose.narration-ready")?.classList.remove(
          "narration-ready",
          "speech-patch-mode"
        );
      }

      function decorateNarration() {
        clearNarrationDecoration();
        const prose = el("reader")?.querySelector(".prose");
        if (!prose || !narration.manifest) return;
        prose.classList.add("narration-ready");
        prose.classList.toggle("speech-patch-mode", model.speechPatch.active);
        const paragraphs = Array.from(prose.querySelectorAll("p")).filter(
          (paragraph) => !paragraph.closest(".footnotes")
        );
        paragraphs.forEach((paragraph, paragraphIndex) => {
          const expected = narration.manifest.sentences.filter(
            (sentence) => Number(sentence.paragraph_index) === paragraphIndex
          );
          if (!expected.length) return;
          const walker = document.createTreeWalker(
            paragraph,
            NodeFilter.SHOW_TEXT
          );
          const nodes = [];
          let node = walker.nextNode();
          while (node) {
            const parent = node.parentElement;
            if (!parent?.closest(".footnote-ref, .math-inline, .math-display")) {
              nodes.push(node);
            }
            node = walker.nextNode();
          }
          const offsets = [];
          let total = 0;
          nodes.forEach((textNode) => {
            offsets.push({
              node: textNode,
              start: total,
              end: total + textNode.data.length,
            });
            total += textNode.data.length;
          });
          const raw = nodes.map((textNode) => textNode.data).join("");
          const ranges = rawNarrationSentenceRanges(raw);
          const usable = Math.min(ranges.length, expected.length);
          offsets.forEach(({ node: textNode, start: nodeStart, end: nodeEnd }) => {
            const fragment = document.createDocumentFragment();
            let cursor = nodeStart;
            for (let index = 0; index < usable; index += 1) {
              const range = ranges[index];
              const start = Math.max(nodeStart, range.start);
              const end = Math.min(nodeEnd, range.end);
              if (end <= start) continue;
              if (start > cursor) {
                fragment.append(
                  textNode.data.slice(cursor - nodeStart, start - nodeStart)
                );
              }
              const span = document.createElement("span");
              span.dataset.narrationSentence = expected[index].id;
              span.textContent = textNode.data.slice(
                start - nodeStart,
                end - nodeStart
              );
              const primary = !paragraph.querySelector(
                `[data-narration-sentence="${expected[index].id}"]`
              );
              if (primary) {
                span.dataset.narrationPrimary = "true";
                span.tabIndex = 0;
                span.setAttribute("role", "button");
                span.setAttribute(
                  "aria-label",
                  model.speechPatch.active
                    ? `修正这句话的朗读：${expected[index].text}`
                    : `从这里朗读：${expected[index].text}`
                );
                const activate = (event) => {
                  if (
                    event instanceof KeyboardEvent &&
                    !["Enter", " "].includes(event.key)
                  ) {
                    return;
                  }
                  event.preventDefault();
                  if (model.speechPatch.active) {
                    selectSpeechPatchSentence(expected[index].id);
                  } else {
                    playNarrationSentence(expected[index].id);
                  }
                };
                span.addEventListener("click", activate);
                span.addEventListener("keydown", activate);
              }
              narration.decorated.push(span);
              fragment.append(span);
              cursor = end;
            }
            if (cursor < nodeEnd) {
              fragment.append(textNode.data.slice(cursor - nodeStart));
            }
            textNode.replaceWith(fragment);
          });
        });
        setActiveNarrationSentence(narration.activeSentenceId, false);
      }

      function formatNarrationTime(milliseconds) {
        const seconds = Math.max(0, Math.floor(milliseconds / 1000));
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function narrationChunkOffset(chunkId) {
        let elapsed = 0;
        for (const chunk of narration.manifest?.chunks || []) {
          if (chunk.id === chunkId) return elapsed;
          elapsed += Number(chunk.duration_ms || 0);
        }
        return 0;
      }

      function activeNarrationSentence() {
        return narration.manifest?.sentences.find(
          (sentence) => sentence.id === narration.activeSentenceId
        );
      }

      function updateNarrationView() {
        const player = el("narrationPlayer");
        player.hidden = !narration.started;
        document.body.classList.toggle("narration-open", narration.started);
        const duration = Number(narration.manifest?.duration_ms || 0);
        el("narrationElapsed").textContent = formatNarrationTime(
          narration.elapsedMs
        );
        el("narrationDuration").textContent = formatNarrationTime(duration);
        el("narrationProgress").max = String(Math.max(1, duration));
        el("narrationProgress").value = String(
          Math.min(narration.elapsedMs, duration || 1)
        );
        const text =
          activeNarrationSentence()?.text || "点正文中的任一句开始朗读";
        el("narrationText").textContent = text;
        el("narrationText").title = text;
        el("narrationToggle").setAttribute(
          "aria-label",
          narration.playing ? "暂停" : "继续播放"
        );
        const icon = el("narrationPlayIcon");
        icon.className = `narration-play-icon ${narration.playing ? "is-pause" : "is-play"}`;
        icon.innerHTML = narration.playing
          ? "<span></span><span></span>"
          : "<span></span>";
      }

      function setActiveNarrationSentence(sentenceId, scroll = true) {
        if (sentenceId === narration.activeSentenceId && !scroll) return;
        narration.activeSentenceId = sentenceId || "";
        document
          .querySelectorAll("[data-narration-sentence]")
          .forEach((element) =>
            element.classList.toggle(
              "narration-current",
              element.dataset.narrationSentence === narration.activeSentenceId
            )
          );
        const current = document.querySelector(
          `[data-narration-sentence="${narration.activeSentenceId}"]`
        );
        if (scroll && current) {
          const bounds = current.getBoundingClientRect();
          if (bounds.top < 64 || bounds.bottom > innerHeight - 120) {
            current.scrollIntoView({
              behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
                ? "auto"
                : "smooth",
              block: "center",
            });
          }
        }
        updateNarrationView();
      }

      function resetNarration() {
        narration.loadToken += 1;
        const audio = el("narrationAudio");
        audio.pause();
        audio.removeAttribute("src");
        audio.removeAttribute("data-chunk-id");
        audio.load();
        clearNarrationDecoration();
        Object.assign(narration, {
          manifest: null,
          key: "",
          loadingKey: "",
          loadingPromise: null,
          activeSentenceId: "",
          activeChunkId: "",
          elapsedMs: 0,
          started: false,
          playing: false,
          pendingStart: null,
          prefetched: new Set(),
        });
        updateNarrationView();
      }

      async function prepareNarration(unit, version) {
        const audioState = version?.audio;
        if (audioState?.status !== "ready" || !audioState.audioVersionId) {
          return null;
        }
        const key = `${unit.unit_id}:${version.id}:${audioState.audioVersionId}`;
        if (narration.key === key && narration.manifest) {
          decorateNarration();
          return narration.manifest;
        }
        if (narration.loadingKey === key && narration.loadingPromise) {
          return narration.loadingPromise;
        }
        if (narration.key && narration.key !== key) resetNarration();
        const token = ++narration.loadToken;
        narration.loadingKey = key;
        narration.loadingPromise = fetch(
          `/api/audio/manifest/${encodeURIComponent(audioState.audioVersionId)}`,
          { cache: "no-store" }
        )
          .then((response) => {
            if (!response.ok) throw new Error("语音清单不可用");
            return response.json();
          })
          .then((manifest) => {
            if (token !== narration.loadToken) return null;
            if (
              manifest.status !== "ready" ||
              manifest.unit_id !== unit.unit_id ||
              manifest.translation_version_id !== version.id ||
              manifest.translation_sha256 !== version.translationSha256
            ) {
              throw new Error("语音与当前译文版本不一致");
            }
            narration.manifest = manifest;
            narration.key = key;
            narration.prefetched = new Set();
            decorateNarration();
            if ("mediaSession" in navigator) {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: unit.title_zh,
                artist: "《资本论》第一卷",
                album: "语音阅读",
              });
            }
            updateNarrationView();
            return manifest;
          })
          .catch((error) => {
            if (token === narration.loadToken) {
              const button = el("narrationStartButton");
              if (button) button.textContent = "语音不可用";
            }
            throw error;
          })
          .finally(() => {
            if (token === narration.loadToken) {
              narration.loadingKey = "";
              narration.loadingPromise = null;
            }
          });
        return narration.loadingPromise;
      }

      function syncNarrationForReader(unit) {
        if (model.view !== "text" || model.compareMode) {
          clearNarrationDecoration();
          return;
        }
        const version = displayedVersion(unit);
        const patchingThisVersion =
          model.speechPatch.active &&
          model.speechPatch.unitId === unit?.unit_id &&
          model.speechPatch.translationVersionId === version?.id;
        const selectedVersion = selectedAudioVersion(unit, version);
        const audioState = patchingThisVersion
          ? {
              ...(version?.audio || {}),
              status: "ready",
              audioVersionId: model.speechPatch.baseAudioVersionId,
            }
          : selectedVersion
            ? {
                ...(version?.audio || {}),
                status: "ready",
                audioVersionId: selectedVersion.id,
              }
            : version?.audio;
        if (audioState?.status !== "ready" || !audioState.audioVersionId) {
          if (narration.key) resetNarration();
          return;
        }
        const key = `${unit.unit_id}:${version.id}:${audioState.audioVersionId}`;
        if (narration.key && narration.key !== key) resetNarration();
        void prepareNarration(unit, { ...version, audio: audioState }).catch(
          () => {}
        );
      }

      function loadNarrationChunk(chunkId, seconds, autoplay) {
        const chunk = narration.manifest?.chunks.find(
          (item) => item.id === chunkId
        );
        if (!chunk) return;
        const audio = el("narrationAudio");
        const source = new URL(chunk.audio_file, location.origin).href;
        narration.started = true;
        narration.activeChunkId = chunkId;
        narration.pendingStart = { chunkId, seconds, autoplay };
        if (audio.src !== source) {
          audio.src = source;
          audio.dataset.chunkId = chunkId;
          audio.load();
        } else {
          audio.currentTime = seconds;
          narration.pendingStart = null;
          if (autoplay) void audio.play().catch(() => {});
        }
        updateNarrationView();
      }

      function playNarrationSentence(sentenceId) {
        const sentence = narration.manifest?.sentences.find(
          (item) => item.id === sentenceId
        );
        if (!sentence) return;
        setActiveNarrationSentence(sentence.id);
        loadNarrationChunk(sentence.chunk_id, sentence.start_ms / 1000, true);
      }

      function firstVisibleNarrationSentence() {
        const elements = Array.from(
          document.querySelectorAll("[data-narration-primary]")
        );
        return (
          elements.find((element) => {
            const bounds = element.getBoundingClientRect();
            return bounds.bottom > 64 && bounds.top < innerHeight * 0.72;
          })?.dataset.narrationSentence ||
          narration.manifest?.sentences[0]?.id ||
          ""
        );
      }

      async function resumeNarration() {
        const audio = el("narrationAudio");
        if (narration.started && audio.src) {
          await audio.play().catch(() => {});
          return;
        }
        playNarrationSentence(firstVisibleNarrationSentence());
      }

      function stepNarration(direction) {
        const sentences = narration.manifest?.sentences || [];
        const current = Math.max(
          0,
          sentences.findIndex(
            (sentence) => sentence.id === narration.activeSentenceId
          )
        );
        const next = sentences[
          Math.min(sentences.length - 1, Math.max(0, current + direction))
        ];
        if (next) playNarrationSentence(next.id);
      }

      function updateNarrationPlayback() {
        const audio = el("narrationAudio");
        if (!narration.manifest || !narration.activeChunkId) return;
        const localMs = audio.currentTime * 1000;
        narration.elapsedMs =
          narrationChunkOffset(narration.activeChunkId) + localMs;
        const active = narration.manifest.sentences.find(
          (sentence) =>
            sentence.chunk_id === narration.activeChunkId &&
            localMs >= sentence.start_ms - 80 &&
            localMs < sentence.end_ms + 180
        );
        if (active && active.id !== narration.activeSentenceId) {
          setActiveNarrationSentence(active.id);
        } else {
          updateNarrationView();
        }
        if (audio.currentTime > 2) {
          const index = narration.manifest.chunks.findIndex(
            (chunk) => chunk.id === narration.activeChunkId
          );
          const next = narration.manifest.chunks[index + 1];
          if (next && !narration.prefetched.has(next.id)) {
            narration.prefetched.add(next.id);
            const link = document.createElement("link");
            link.rel = "prefetch";
            link.as = "audio";
            link.href = next.audio_file;
            document.head.append(link);
          }
        }
      }

      function continueNarration() {
        const chunks = narration.manifest?.chunks || [];
        const index = chunks.findIndex(
          (chunk) => chunk.id === narration.activeChunkId
        );
        const next = chunks[index + 1];
        if (!next) {
          narration.playing = false;
          updateNarrationView();
          return;
        }
        const firstSentence = narration.manifest.sentences.find(
          (sentence) => sentence.chunk_id === next.id
        );
        if (firstSentence) setActiveNarrationSentence(firstSentence.id);
        loadNarrationChunk(next.id, 0, true);
      }

      function seekNarration(milliseconds) {
        let offset = 0;
        for (const chunk of narration.manifest?.chunks || []) {
          if (milliseconds <= offset + chunk.duration_ms) {
            loadNarrationChunk(
              chunk.id,
              Math.max(0, milliseconds - offset) / 1000,
              narration.playing
            );
            return;
          }
          offset += chunk.duration_ms;
        }
      }

      function selectChapter(chapterId) {
        resetSpeechPatch();
        model.chapterId = chapterId;
        const chapter = currentChapter();
        const preferred =
          chapter.sections?.find((unit) => unit.preview) ||
          chapter.sections?.find((unit) => unit.status !== "planned") ||
          chapter.sections?.[0];
        model.unitId = preferred?.unit_id || null;
        model.selectedVersionId = null;
        model.view = "text";
        model.compareMode = false;
        model.compareBaseVersionId = null;
        model.compareTargetVersionId = null;
        saveReadingPosition();
        render();
        if (
          matchMedia("(max-width: 900px)").matches &&
          (chapter.sections?.length || 0) <= 1
        ) {
          setCatalogCollapsed(true);
          requestAnimationFrame(() => {
            el("workspace").scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          });
        }
      }

      function selectUnit(unitId) {
        resetSpeechPatch();
        model.unitId = unitId;
        model.selectedVersionId = null;
        model.view = "text";
        model.compareMode = false;
        model.compareBaseVersionId = null;
        model.compareTargetVersionId = null;
        saveReadingPosition();
        render();
        if (matchMedia("(max-width: 900px)").matches) {
          setCatalogCollapsed(true);
          requestAnimationFrame(() => {
            el("workspace").scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          });
        }
      }

      function catalogFact(label, value, tone = "") {
        const labelMarkup = label
          ? `<span class="catalog-fact-label">${escapeHtml(label)}</span>`
          : "";
        return `<span class="catalog-fact ${escapeHtml(tone)}">${labelMarkup}${escapeHtml(value)}</span>`;
      }

      function unitVersionCatalogFact(unit) {
        if (unit.adoptedVersionId) {
          return catalogFact(
            "译文",
            `第${unit.currentVersion}版已采用 / 共${unit.versionCount}版`,
            unit.status === "needs_review" ? "problem" : ""
          );
        }
        if (unit.versionCount) {
          return catalogFact("译文", `${unit.versionCount}版待采用`, "active");
        }
        return catalogFact("译文", unit.statusLabel || "未开始");
      }

      function audioProgressText(audio) {
        return audio?.chunkCount
          ? ` ${audio.completedChunks || 0}/${audio.chunkCount}`
          : "";
      }

      function unitAudioCatalogFact(unit) {
        const audio = unit.audio || {};
        const readyCount = (audio.versions || []).filter(
          (version) => version.status === "ready"
        ).length;
        const facts = {
          ready: {
            value: readyCount > 1 ? `已采用 / 共${readyCount}版` : "已采用",
            tone: "ready",
          },
          unadopted: {
            value: `${readyCount || 1}版待采用`,
            tone: "active",
          },
          generating: {
            value: `生成中${audioProgressText(audio)}`,
            tone: "active",
          },
          queued: { value: "等待生成", tone: "active" },
          interrupted: {
            value: `生成中断${audioProgressText(audio)}`,
            tone: "problem",
          },
          failed: { value: "生成失败", tone: "problem" },
          stale: { value: "旧语音不可用", tone: "problem" },
          missing: { value: "暂无", tone: "" },
        };
        const fact = facts[audio.status] || {
          value: audio.label || "暂无",
          tone: "",
        };
        return catalogFact("语音", fact.value, fact.tone);
      }

      function unitPublicationCatalogFact(unit) {
        const audio = unit.audio || {};
        if (audio.status === "unadopted") {
          return catalogFact("发布", "采用语音后可上传", "active");
        }
        if (audio.status !== "ready") {
          return catalogFact("发布", "未上传");
        }
        const publication = audio.publication || {};
        const facts = {
          published: { value: "已上线", tone: "ready" },
          uploaded: { value: "已上传，待上线", tone: "active" },
          uploading: { value: publication.label || "上传中", tone: "active" },
          queued: { value: "等待上传", tone: "active" },
          interrupted: {
            value: publication.label || "上传中断",
            tone: "problem",
          },
          failed: { value: "上传失败", tone: "problem" },
          pending: { value: "待上传", tone: "active" },
          unavailable: { value: "待上传", tone: "active" },
        };
        const fact = facts[publication.status] || {
          value: publication.label || "待上传",
          tone: "active",
        };
        return catalogFact("发布", fact.value, fact.tone);
      }

      function chapterCatalogFacts(chapter) {
        const sections = chapter.sections || [];
        const total = chapter.totalSections || sections.length || 1;
        const completed = sections.filter(
          (unit) => unit.status === "completed"
        ).length;
        const adopted = sections.filter((unit) => unit.adoptedVersionId).length;
        const versionCount = sections.reduce(
          (sum, unit) => sum + Number(unit.versionCount || 0),
          0
        );
        const voiced = sections.filter((unit) =>
          (unit.audio?.versions || []).some(
            (version) => version.status === "ready"
          )
        ).length;
        const published = sections.filter(
          (unit) =>
            unit.audio?.status === "ready" &&
            unit.audio?.publication?.status === "published"
        ).length;
        const issueDefinitions = [
          ["needs_review", "待复核", (unit) => unit.status],
          ["unadopted", "语音待选", (unit) => unit.audio?.status],
          ["generating", "语音生成中", (unit) => unit.audio?.status],
          ["queued", "语音等待生成", (unit) => unit.audio?.status],
          ["interrupted", "语音生成中断", (unit) => unit.audio?.status],
          ["failed", "语音生成失败", (unit) => unit.audio?.status],
          ["stale", "旧语音不可用", (unit) => unit.audio?.status],
          ["uploaded", "已上传待上线", (unit) => unit.audio?.publication?.status],
          ["uploading", "上传中", (unit) => unit.audio?.publication?.status],
          ["queued", "等待上传", (unit) =>
            unit.audio?.status === "ready"
              ? unit.audio?.publication?.status
              : ""
          ],
          ["interrupted", "上传中断", (unit) => unit.audio?.publication?.status],
          ["failed", "上传失败", (unit) => unit.audio?.publication?.status],
          ["pending", "待上传", (unit) =>
            unit.audio?.status === "ready"
              ? unit.audio?.publication?.status
              : ""
          ],
        ];
        const issues = issueDefinitions.flatMap(
          ([status, label, read]) => {
            const count = sections.filter((unit) => read(unit) === status).length;
            return count ? [catalogFact("", `${count}${label}`, status === "uploaded" || status === "uploading" || status === "queued" || status === "pending" || status === "unadopted" || status === "generating" ? "active" : "problem")] : [];
          }
        );
        return {
          translation: [
            catalogFact("译文", `${completed}/${total}完成`, completed === total ? "ready" : ""),
            catalogFact("采用", `${adopted}/${total}`, adopted === total && adopted ? "ready" : adopted ? "active" : ""),
            ...(versionCount ? [catalogFact("", `共${versionCount}版`)] : []),
          ].join(""),
          audio: versionCount
            ? [
                catalogFact("语音", `${voiced}/${total}`, voiced === total ? "ready" : ""),
                catalogFact("上线", `${published}/${total}`, published === total ? "ready" : ""),
                ...issues,
              ].join("")
            : "",
        };
      }

      function renderCatalog() {
        const chapterMarkup = (chapter) => {
          const facts = chapterCatalogFacts(chapter);
          return `<div class="chapter-group">
            <button
              class="chapter ${chapter.id === model.chapterId ? "selected" : ""}"
              data-chapter="${chapter.id}"
              aria-current="${chapter.id === model.chapterId ? "true" : "false"}"
              ${chapter.sections?.length > 1
                ? `aria-expanded="${chapter.id === model.chapterId ? "true" : "false"}"`
                : ""}
            >
              <span class="chapter-no">${String(chapter.number).padStart(2, "0")}</span>
              <span class="chapter-copy">
                <span class="chapter-title">${escapeHtml(chapter.title)}</span>
                <span class="chapter-meta">${facts.translation}</span>
                ${facts.audio ? `<span class="chapter-meta">${facts.audio}</span>` : ""}
              </span>
            </button>
            ${chapter.id === model.chapterId && chapter.sections?.length > 1 ? `
              <div class="chapter-sections" aria-label="${escapeHtml(chapter.title)}的小节">
                ${chapter.sections.map((unit) => `
                  <button
                    class="catalog-section ${unit.unit_id === model.unitId ? "selected" : ""}"
                    data-unit="${unit.unit_id}"
                    aria-current="${unit.unit_id === model.unitId ? "true" : "false"}"
                  >
                    <span class="catalog-section-copy">
                      <strong>${unit.number && !chapter.frontMatter ? `第${unit.number}节 · ` : ""}${escapeHtml(unit.title_zh)}</strong>
                      <small>${unitVersionCatalogFact(unit)}</small>
                      <small>${unitAudioCatalogFact(unit)}${unitPublicationCatalogFact(unit)}</small>
                    </span>
                  </button>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `;
        };
        el("catalog").innerHTML = `
          <div class="catalog-toolbar">
            <strong>全书目录</strong>
            <button
              class="catalog-control"
              id="catalogCollapse"
              type="button"
              aria-controls="catalog"
              aria-expanded="true"
            >收起</button>
          </div>
          ${(model.state.frontMatter || []).length ? `
            <section class="part">
              <p class="part-title">序言与版本说明</p>
              ${model.state.frontMatter.map(chapterMarkup).join("")}
            </section>
          ` : ""}
          ${model.state.parts.map((part) => `
            <section class="part">
              <p class="part-title">第${part.number}篇 · ${escapeHtml(part.title)}</p>
              ${part.chapters.map(chapterMarkup).join("")}
            </section>
          `).join("")}
        `;

        document.querySelectorAll("[data-chapter]").forEach((button) => {
          button.addEventListener("click", () => selectChapter(button.dataset.chapter));
        });
        document.querySelectorAll("[data-unit]").forEach((button) => {
          button.addEventListener("click", () => selectUnit(button.dataset.unit));
        });
        el("catalogCollapse")?.addEventListener("click", () => {
          setCatalogCollapsed(true, true);
        });
        setCatalogCollapsed(
          el("workspace").classList.contains("catalog-collapsed")
        );
      }

      function renderAudioManager(unit, version) {
        const audio = version?.audio;
        if (!audio) return "";
        const readyVersions = (audio.versions || []).filter(
          (item) => item.status === "ready"
        );
        const selectedVersion = selectedAudioVersion(unit, version);
        const selectedModel = selectedAudioModel(unit, version);
        const generationPlan =
          model.audioGenerationPlan?.unitId === unit?.unit_id &&
          model.audioGenerationPlan?.versionId === version?.id &&
          model.audioGenerationPlan?.modelId === selectedModel?.id
            ? model.audioGenerationPlan
            : null;
        const patchStatus = speechPatchStatusFor(unit, version);
        const publication = selectedVersion?.publication;
        const publishing = ["uploading", "queued"].includes(
          publication?.status
