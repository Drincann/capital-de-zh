<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="《资本论》第一卷通俗新译的本地目录、状态、版本与正文。"
    />
    <title>《资本论》第一卷 · 目录</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("capital-progress-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3f0e9;
        --surface: #fbfaf7;
        --ink: #24211d;
        --muted: #746f67;
        --faint: #a49e94;
        --line: #ded9cf;
        --accent: #983d32;
        --accent-soft: #f1e3df;
        --green: #3e6956;
        --green-soft: #e5eee9;
        --blue: #4c6378;
        --blue-soft: #e7edf1;
        --catalog: rgba(247, 245, 240, 0.78);
        --hover: rgba(36, 33, 29, 0.045);
        --selected: #ebe6dd;
        --status-bg: #ece8e0;
        --active-surface: #f3efe8;
        --control-border-hover: #b7aea2;
        --dot: #c8c2b8;
        --note-line: #c7b49b;
        --note-ink: #665c50;
        --diff-remove-bg: #f6ded9;
        --diff-remove-ink: #83352d;
        --diff-add-bg: #dfece5;
        --diff-add-ink: #2f614b;
        --shadow: rgba(43, 36, 29, 0.16);
        --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
        --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #171614;
        --surface: #201e1b;
        --ink: #e8e3da;
        --muted: #aaa39a;
        --faint: #817a72;
        --line: #39342f;
        --accent: #dc7869;
        --accent-soft: #3c2521;
        --green: #84b79d;
        --green-soft: #21342b;
        --blue: #90aec6;
        --blue-soft: #243440;
        --catalog: rgba(27, 25, 22, 0.88);
        --hover: rgba(255, 255, 255, 0.055);
        --selected: #302c27;
        --status-bg: #302c27;
        --active-surface: #2b2824;
        --control-border-hover: #655e56;
        --dot: #5f5952;
        --note-line: #826f58;
        --note-ink: #c1b5a6;
        --diff-remove-bg: #4a2825;
        --diff-remove-ink: #f1aea4;
        --diff-add-bg: #243c31;
        --diff-add-ink: #a9d6bf;
        --shadow: rgba(0, 0, 0, 0.42);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
      }

      button { font: inherit; }
      .shell { width: min(1500px, 100%); margin: 0 auto; padding: 24px 28px 48px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 52px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: baseline; gap: 11px; }
      .brand strong { font: 600 18px/1 var(--serif); letter-spacing: 0.04em; }
      .brand span { color: var(--muted); font-size: 13px; }
      .top-actions { display: flex; align-items: center; gap: 14px; }
      .updated { color: var(--faint); font-size: 12px; white-space: nowrap; }
      .theme-toggle {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--control-border-hover);
        color: var(--ink);
        background: var(--hover);
      }

      .overview {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        padding: 30px 0 24px;
      }
      .overview h1 {
        margin: 0;
        font: 600 clamp(29px, 4vw, 46px)/1.12 var(--serif);
        letter-spacing: -0.03em;
      }
      .stats { display: flex; gap: 28px; }
      .stat { min-width: 64px; }
      .stat strong { display: block; font: 600 24px/1 var(--serif); }
      .stat span { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; }
      .privacy-note {
        margin: 14px 0 0;
        color: var(--faint);
        font-size: 10px;
        text-align: right;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
        min-height: 720px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .workspace.catalog-collapsed { grid-template-columns: minmax(0, 1fr); }
      .workspace.catalog-collapsed .catalog { display: none; }
      .catalog {
        min-height: 720px;
        border-right: 1px solid var(--line);
        background: var(--catalog);
      }
      .catalog-toolbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 18px 0 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .catalog-toolbar strong {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .catalog-control,
      .catalog-expand {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        cursor: pointer;
      }
      .catalog-control:hover,
      .catalog-expand:hover {
        border-color: var(--line);
        color: var(--ink);
        background: var(--hover);
      }
      .catalog-control::before,
      .catalog-expand::before {
        width: 6px;
        height: 6px;
        border-bottom: 1px solid currentColor;
        border-left: 1px solid currentColor;
        content: "";
        transform: rotate(45deg);
      }
      .catalog-expand { display: none; }
      .catalog-expand::before {
        border: 0;
        border-top: 1px solid currentColor;
        border-right: 1px solid currentColor;
      }
      .workspace.catalog-collapsed .catalog-expand { display: inline-flex; }
      .part { padding: 19px 14px 12px; border-bottom: 1px solid var(--line); }
      .part:last-child { border-bottom: 0; }
      .part-title {
        margin: 0 8px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .chapter {
        width: 100%;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 10px 9px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .chapter:hover { background: var(--hover); }
      .chapter.selected { background: var(--selected); }
      .chapter-no {
        color: var(--faint);
        font: 500 12px/1 var(--serif);
        font-variant-numeric: tabular-nums;
      }
      .chapter-title {
        overflow: hidden;
        font-size: 13px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chapter-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--faint);
        font-size: 10px;
        white-space: nowrap;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
      .dot.completed { background: var(--green); }
      .dot.in_progress { background: var(--accent); }
      .dot.source_ready { background: var(--blue); }

      .content { min-width: 0; background: var(--surface); }
      .chapter-head {
        padding: 38px 46px 26px;
        border-bottom: 1px solid var(--line);
      }
      .chapter-context {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 28px;
        margin-bottom: 8px;
      }
      .chapter-part {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .chapter-head h2 {
        margin: 0;
        font: 600 clamp(25px, 3vw, 38px)/1.22 var(--serif);
        letter-spacing: -0.025em;
      }
      .chapter-summary {
        display: flex;
        align-items: center;
        gap: 10px 18px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--status-bg);
      }
      .status.completed { color: var(--green); background: var(--green-soft); }
      .status.in_progress { color: var(--accent); background: var(--accent-soft); }
      .status.source_ready { color: var(--blue); background: var(--blue-soft); }

      .section-list {
        display: flex;
        gap: 8px;
        padding: 16px 46px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        scrollbar-width: none;
      }
      .section-list::-webkit-scrollbar { display: none; }
      .section-button {
        min-width: 180px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .section-button.selected {
        border-color: var(--control-border-hover);
        background: var(--active-surface);
      }
      .section-button strong {
        display: block;
        overflow: hidden;
        font-size: 12px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .section-button span { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }

      .reader-nav {
        display: flex;
        gap: 22px;
        padding: 0 46px;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        padding: 15px 0 13px;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        cursor: pointer;
      }
      .tab.active { color: var(--ink); border-color: var(--accent); }

      .reader { min-height: 510px; padding: 40px 46px 64px; }
      .reader-inner { max-width: 760px; margin: 0 auto; }
      .reader-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      .reader-title h3 { margin: 0; font: 600 19px/1.3 var(--serif); }
      .version-tag { color: var(--muted); font-size: 11px; }
      .version-tools { display: flex; align-items: center; gap: 8px; }
      .small-action {
        min-height: 31px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: transparent;
        font: 11px/1 var(--sans);
      }
      .small-action {
        padding: 0 10px;
        white-space: nowrap;
        cursor: pointer;
      }
      .small-action:hover {
        border-color: var(--control-border-hover);
        background: var(--active-surface);
      }
      .small-action.active {
        border-color: var(--control-border-hover);
        color: var(--ink);
        background: var(--active-surface);
      }
      .version-picker { position: relative; min-width: 116px; }
      .version-trigger {
        width: 100%;
        min-height: 31px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 9px 0 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: var(--surface);
        font: 11px/1 var(--sans);
        cursor: pointer;
      }
      .version-trigger::after {
        width: 6px;
        height: 6px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(45deg) translateY(-2px);
      }
      .version-trigger[aria-expanded="true"] {
        border-color: var(--control-border-hover);
      }
      .version-trigger[aria-expanded="true"]::after {
        transform: rotate(225deg) translate(-1px, -1px);
      }
      .version-menu {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        right: 0;
        min-width: 170px;
        max-height: 260px;
        padding: 5px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 12px 32px var(--shadow);
      }
      .version-menu[hidden] { display: none; }
      .version-option {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 9px 10px;
        border: 0;
        border-radius: 4px;
        color: var(--ink);
        background: transparent;
        font: 11px/1.3 var(--sans);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .version-option:hover,
      .version-option[aria-selected="true"] { background: var(--active-surface); }
      .version-option small { color: var(--green); font-size: 10px; }
      .adopted-mark { color: var(--green); font-size: 11px; white-space: nowrap; }
      .prose { font: 400 17px/1.95 var(--serif); }
      .prose h1 { margin: 0 0 32px; font-size: 25px; line-height: 1.35; }
      .prose h2 { margin: 38px 0 20px; font-size: 21px; line-height: 1.4; }
      .prose h3 { margin: 30px 0 16px; font-size: 18px; line-height: 1.5; }
      .prose h4,
      .prose h5,
      .prose h6 {
        margin: 25px 0 13px;
        font-size: 16px;
        line-height: 1.55;
      }
      .prose p { margin: 0 0 1.18em; }
      .prose a {
        color: var(--blue);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .prose strong { font-weight: 650; }
      .prose ul,
      .prose ol { margin: 0 0 1.2em; padding-left: 1.7em; }
      .prose li { margin: 0.25em 0; padding-left: 0.15em; }
      .prose blockquote {
        margin: 1.35em 0;
        padding: 0.1em 0 0.1em 1.15em;
        border-left: 2px solid var(--note-line);
        color: var(--muted);
      }
      .prose blockquote p:last-child { margin-bottom: 0; }
      .prose code {
        padding: 0.12em 0.32em;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--catalog);
        font: 0.88em/1.5 Consolas, "SFMono-Regular", monospace;
      }
      .prose pre {
        margin: 1.35em 0;
        padding: 15px 17px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--catalog);
      }
      .prose pre code {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 13px;
        white-space: pre;
      }
      .prose hr {
        margin: 2em 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .prose .table-wrap {
        margin: 1.35em 0;
        overflow-x: auto;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        font: 14px/1.65 var(--sans);
      }
      .prose th,
      .prose td {
        padding: 9px 11px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .prose th {
        background: var(--catalog);
        font-weight: 600;
      }
      .prose sup {
        font: 10px/1 var(--sans);
        vertical-align: super;
      }
      .prose .footnotes {
        margin-top: 2.4em;
        color: var(--muted);
        font: 13px/1.75 var(--sans);
      }
      .prose .footnotes ol { padding-left: 1.65em; }
      .prose .footnotes li { scroll-margin-top: 20px; }
      .prose .footnote-backref {
        margin-left: 0.35em;
        text-decoration: none;
      }
      .translator-note {
        display: block;
        margin: 22px 0;
        padding-left: 14px;
        border-left: 2px solid var(--note-line);
        color: var(--note-ink);
        font: 14px/1.75 var(--sans);
      }

      .diff-toolbar {
        display: flex;
        align-items: end;
        gap: 12px;
        margin-bottom: 24px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--catalog);
      }
      .diff-choice { min-width: 150px; }
      .diff-choice > span {
        display: block;
        margin-bottom: 7px;
        color: var(--faint);
        font-size: 10px;
      }
      .diff-arrow { padding-bottom: 8px; color: var(--faint); font-size: 13px; }
      .diff-filter { margin-left: auto; }
      .diff-mode {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .diff-mode + .diff-filter { margin-left: 0; }
      .diff-legend {
        display: flex;
        gap: 18px;
        margin: -7px 0 28px;
        color: var(--muted);
        font-size: 11px;
      }
      .diff-legend span::before {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 2px;
        content: "";
        vertical-align: -1px;
      }
      .diff-legend .removed::before { background: var(--diff-remove-bg); }
      .diff-legend .added::before { background: var(--diff-add-bg); }
      .diff-prose .diff-block.unchanged { color: var(--muted); }
      .diff-prose del,
      .diff-prose ins {
        padding: 0.06em 0.12em;
        border-radius: 3px;
        text-decoration-thickness: 1px;
      }
      .diff-prose del {
        color: var(--diff-remove-ink);
        background: var(--diff-remove-bg);
      }
      .diff-prose ins {
        color: var(--diff-add-ink);
        background: var(--diff-add-bg);
        text-decoration: none;
      }
      .diff-prose.paragraph-mode .diff-block.removed,
      .diff-prose.paragraph-mode .diff-block.added {
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 5px;
      }
      .diff-prose.paragraph-mode .diff-block.removed {
        color: var(--diff-remove-ink);
        background: var(--diff-remove-bg);
      }
      .diff-prose.paragraph-mode .diff-block.added {
        color: var(--diff-add-ink);
        background: var(--diff-add-bg);
      }
      .diff-prose.paragraph-mode .diff-block.removed del,
      .diff-prose.paragraph-mode .diff-block.added ins {
        padding: 0;
        color: inherit;
        background: transparent;
        text-decoration: none;
      }

      .versions { display: grid; gap: 10px; }
      .version-row {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 16px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .version-row strong { font: 600 15px/1 var(--serif); }
      .version-row p { margin: 0; color: var(--muted); font-size: 12px; }
      .version-row time { color: var(--faint); font-size: 11px; }
      .version-actions { display: flex; align-items: center; gap: 7px; }
      .review-notice {
        margin: 0 0 24px;
        padding: 12px 14px;
        border-left: 2px solid var(--accent);
        color: var(--ink);
        background: var(--active-surface);
        font: 13px/1.65 var(--sans);
      }
      .version-row .review-notice {
        grid-column: 2 / -1;
        margin: -6px 0 2px;
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 330px;
        color: var(--faint);
        text-align: center;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .shell { padding: 18px 16px 36px; }
        .overview { align-items: flex-start; flex-direction: column; gap: 22px; }
        .stats { width: 100%; justify-content: space-between; gap: 12px; }
        .workspace { grid-template-columns: 1fr; }
        .catalog {
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .chapter-head { padding: 28px 24px 22px; }
        .section-list, .reader-nav { padding-left: 24px; padding-right: 24px; }
        .reader { padding: 32px 24px 52px; }
        .diff-toolbar { align-items: stretch; flex-direction: column; }
        .diff-choice { width: 100%; }
        .diff-arrow { display: none; }
        .diff-mode,
        .diff-filter { margin-left: 0; }
      }

      @media (max-width: 520px) {
        .topbar { align-items: flex-start; }
        .brand { flex-direction: column; gap: 5px; }
        .top-actions { align-items: flex-end; flex-direction: column; gap: 7px; }
        .updated { padding-top: 3px; }
        .overview { padding-top: 24px; }
        .stat strong { font-size: 20px; }
        .stat span { font-size: 10px; }
        .chapter-head h2 { font-size: 27px; }
        .reader-title {
          align-items: flex-start;
          flex-direction: column;
          gap: 14px;
          margin-bottom: 26px;
        }
        .version-tools {
          width: 100%;
          flex-wrap: wrap;
        }
        .version-tools .version-picker {
          min-width: 132px;
        }
        .prose { font-size: 16px; line-height: 1.9; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong>《资本论》第一卷</strong>
        </div>
        <div class="top-actions">
          <button class="theme-toggle" id="themeToggle" type="button">深色</button>
          <span class="updated" id="updated">读取中</span>
        </div>
      </header>

      <section class="overview">
        <h1>目录</h1>
        <div class="stats" aria-label="全书概况">
          <div class="stat"><strong id="partCount">7</strong><span>篇</span></div>
          <div class="stat"><strong id="chapterCount">25</strong><span>章</span></div>
          <div class="stat"><strong id="completedUnits">0</strong><span>节已完成</span></div>
          <div class="stat"><strong id="versionCount">0</strong><span>个版本</span></div>
          <div class="stat"><strong id="visitorCount">—</strong><span>位访客</span></div>
          <div class="stat"><strong id="pageViewCount">—</strong><span>次浏览</span></div>
        </div>
      </section>

      <main class="workspace" id="workspace">
        <aside class="catalog" id="catalog" aria-label="全书目录"></aside>

        <section class="content">
          <header class="chapter-head">
            <div class="chapter-context">
              <button
                class="catalog-expand"
                id="catalogExpand"
                type="button"
                aria-controls="catalog"
              >展开目录</button>
              <p class="chapter-part" id="chapterPart"></p>
            </div>
            <h2 id="chapterTitle"></h2>
            <div class="chapter-summary">
              <span class="status" id="chapterStatus"></span>
              <span id="chapterSections"></span>
              <span id="chapterVersions"></span>
            </div>
          </header>

          <div class="section-list" id="sectionList"></div>

          <nav class="reader-nav" aria-label="内容视图">
            <button class="tab active" data-view="text">正文</button>
            <button class="tab" data-view="versions">版本</button>
          </nav>

          <div class="reader">
            <div class="reader-inner" id="reader"></div>
          </div>
        </section>
      </main>
      <p class="privacy-note">访问本站会记录 IP、设备、来源与访问页面等访问明细。</p>
    </div>

    <script>
      const model = {
        state: null,
        chapterId: null,
        unitId: null,
        selectedVersionId: null,
        view: "text",
        compareMode: false,
        compareBaseVersionId: null,
        compareTargetVersionId: null,
        diffOnly: false,
        diffMode: "inline",
      };
      const el = (id) => document.getElementById(id);
      const themeQuery = matchMedia("(prefers-color-scheme: dark)");
      const catalogPreferenceKey = "capital-progress-catalog-collapsed";
      const readingPositionKey = "capital-progress-reading-position";
      let readingPositionRestored = false;

      function readReadingPosition() {
        try {
          return JSON.parse(localStorage.getItem(readingPositionKey) || "null");
        } catch {
          return null;
        }
      }

      function saveReadingPosition() {
        try {
          localStorage.setItem(
            readingPositionKey,
            JSON.stringify({
              chapterId: model.chapterId,
              unitId: model.unitId,
              selectedVersionId: model.selectedVersionId,
            })
          );
        } catch {}
      }

      function updateThemeToggle() {
        const isDark = document.documentElement.dataset.theme === "dark";
        const button = el("themeToggle");
        button.textContent = isDark ? "浅色" : "深色";
        button.setAttribute(
          "aria-label",
          isDark ? "切换到浅色模式" : "切换到深色模式"
        );
        button.setAttribute("aria-pressed", String(isDark));
      }

      function setTheme(theme, persist = false) {
        document.documentElement.dataset.theme = theme;
        if (persist) {
          try {
            localStorage.setItem("capital-progress-theme", theme);
          } catch {}
        }
        updateThemeToggle();
      }

      function setCatalogCollapsed(collapsed, persist = false) {
        el("workspace").classList.toggle("catalog-collapsed", collapsed);
        const collapseButton = el("catalogCollapse");
        const expandButton = el("catalogExpand");
        collapseButton?.setAttribute("aria-expanded", String(!collapsed));
        expandButton?.setAttribute("aria-expanded", String(!collapsed));
        if (persist) {
          try {
            localStorage.setItem(catalogPreferenceKey, String(collapsed));
          } catch {}
        }
      }

      function escapeHtml(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }

      function safeMarkdownId(value = "") {
        return String(value)
          .trim()
          .replace(/[^A-Za-z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "") || "note";
      }

      function safeMarkdownUrl(value = "") {
        const url = String(value).trim();
        return /^(?:https?:|mailto:|#|\/(?!\/)|\.{1,2}\/)/i.test(url)
          ? escapeHtml(url)
          : "";
      }

      function renderInlineMarkdown(value = "", context = {}) {
        const tokens = [];
        const stash = (html) => {
          tokens.push(html);
          return `\u0000${tokens.length - 1}\u0000`;
        };
        let output = escapeHtml(value);

        output = output.replace(/`([^`\n]+)`/g, (_, code) =>
          stash(`<code>${code}</code>`)
        );
        output = output.replace(
          /!\[([^\]]*)\]\((\S+?)(?:\s+&quot;[^&]*&quot;)?\)/g,
          (_, alt, target) => {
            const url = safeMarkdownUrl(target);
            return url
              ? stash(`<img src="${url}" alt="${alt}" loading="lazy">`)
              : alt;
          }
        );
        output = output.replace(
          /\[([^\]]+)\]\((\S+?)(?:\s+&quot;[^&]*&quot;)?\)/g,
          (_, label, target) => {
            const url = safeMarkdownUrl(target);
            return url
              ? stash(`<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`)
              : label;
          }
        );
        output = output.replace(/\[\^([^\]]+)\]/g, (_, label) => {
          const id = safeMarkdownId(label);
          const counts = context.referenceCounts || new Map();
          context.referenceCounts = counts;
          const count = (counts.get(id) || 0) + 1;
          counts.set(id, count);
          return stash(
            `<sup id="fnref-${id}-${count}"><a href="#fn-${id}">${escapeHtml(label)}</a></sup>`
          );
        });
        output = output
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
          .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
          .replace(/(^|[^\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
          .replace(/(^|[^\w])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");

        return output.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[index]);
      }

      function markdownTableRow(line = "") {
        return line
          .trim()
          .replace(/^\||\|$/g, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function isMarkdownTableDivider(line = "") {
        const cells = markdownTableRow(line);
        return cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
      }

      function renderMarkdown(value = "") {
        const normalized = String(value).replace(/\r\n?/g, "\n").trim();
        if (!normalized) return "";

        const sourceLines = normalized.split("\n");
        const lines = [];
        const footnotes = new Map();
        for (let index = 0; index < sourceLines.length; index += 1) {
          const definition = sourceLines[index].match(/^\[\^([^\]]+)\]:\s*(.*)$/);
          if (!definition) {
            lines.push(sourceLines[index]);
            continue;
          }
          const body = [definition[2]];
          while (
            index + 1 < sourceLines.length &&
            /^(?: {2,}|\t)\S/.test(sourceLines[index + 1])
          ) {
            index += 1;
            body.push(sourceLines[index].trim());
          }
          footnotes.set(definition[1], body.join(" "));
          lines.push("");
        }

        const context = { referenceCounts: new Map() };
        const output = [];
        const isBlockStart = (index) => {
          const line = lines[index] || "";
          const next = lines[index + 1] || "";
          return (
            /^ {0,3}(?:#{1,6}\s|```|>|[-+*]\s+|\d+[.)]\s+)/.test(line) ||
            /^ {0,3}(?:[-*_]\s*){3,}$/.test(line) ||
            (line.includes("|") && isMarkdownTableDivider(next))
          );
        };

        for (let index = 0; index < lines.length;) {
          const line = lines[index];
          if (!line.trim()) {
            index += 1;
            continue;
          }

          const fence = line.match(/^ {0,3}```([\w-]*)\s*$/);
          if (fence) {
            const code = [];
            index += 1;
            while (index < lines.length && !/^ {0,3}```\s*$/.test(lines[index])) {
              code.push(lines[index]);
              index += 1;
            }
            if (index < lines.length) index += 1;
            const language = fence[1]
              ? ` class="language-${escapeHtml(fence[1])}"`
              : "";
            output.push(
              `<pre><code${language}>${escapeHtml(code.join("\n"))}</code></pre>`
            );
            continue;
          }

          const heading = line.match(/^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
          if (heading) {
            const level = heading[1].length;
            output.push(
              `<h${level}>${renderInlineMarkdown(heading[2], context)}</h${level}>`
            );
            index += 1;
            continue;
          }

          if (/^ {0,3}(?:[-*_]\s*){3,}$/.test(line)) {
            output.push("<hr>");
            index += 1;
            continue;
          }

          if (line.includes("|") && isMarkdownTableDivider(lines[index + 1] || "")) {
            const headers = markdownTableRow(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].trim().includes("|")) {
              rows.push(markdownTableRow(lines[index]));
              index += 1;
            }
            output.push(
              `<div class="table-wrap"><table><thead><tr>${
                headers.map((cell) =>
                  `<th>${renderInlineMarkdown(cell, context)}</th>`
                ).join("")
              }</tr></thead><tbody>${
                rows.map((row) =>
                  `<tr>${headers.map((_, cellIndex) =>
                    `<td>${renderInlineMarkdown(row[cellIndex] || "", context)}</td>`
                  ).join("")}</tr>`
                ).join("")
              }</tbody></table></div>`
            );
            continue;
          }

          const quote = line.match(/^ {0,3}>\s?(.*)$/);
          if (quote) {
            const quoteLines = [];
            while (index < lines.length) {
              const current = lines[index].match(/^ {0,3}>\s?(.*)$/);
              if (!current) break;
              quoteLines.push(current[1]);
              index += 1;
            }
            output.push(
              `<blockquote><p>${renderInlineMarkdown(
                quoteLines.join(" "),
                context
              )}</p></blockquote>`
            );
            continue;
          }

          const listItem = line.match(/^ {0,3}(?:([-+*])|(\d+)[.)])\s+(.+)$/);
          if (listItem) {
            const ordered = Boolean(listItem[2]);
            const tag = ordered ? "ol" : "ul";
            const items = [];
            while (index < lines.length) {
              const current = lines[index].match(
                /^ {0,3}(?:([-+*])|(\d+)[.)])\s+(.+)$/
              );
              if (!current || Boolean(current[2]) !== ordered) break;
              items.push(current[3]);
              index += 1;
            }
            output.push(
              `<${tag}>${items.map((item) =>
                `<li>${renderInlineMarkdown(item, context)}</li>`
              ).join("")}</${tag}>`
            );
            continue;
          }

          const paragraph = [];
          while (
            index < lines.length &&
            lines[index].trim() &&
            (paragraph.length === 0 || !isBlockStart(index))
          ) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          const text = paragraph.join(" ");
          const className = text.startsWith("〔译者注：")
            ? ' class="translator-note"'
            : "";
          output.push(
            `<p${className}>${renderInlineMarkdown(text, context)}</p>`
          );
        }

        if (footnotes.size) {
          output.push(
            `<section class="footnotes" aria-label="脚注"><hr><ol>${
              Array.from(footnotes, ([label, body]) => {
                const id = safeMarkdownId(label);
                const backref = context.referenceCounts.has(id)
                  ? `<a class="footnote-backref" href="#fnref-${id}-1" aria-label="返回正文">↩</a>`
                  : "";
                return `<li id="fn-${id}">${renderInlineMarkdown(body, context)}${backref}</li>`;
              }).join("")
            }</ol></section>`
          );
        }

        return output.join("");
      }

      function stripLeadingDocumentHeadings(value = "") {
        return value
          .trimStart()
          .replace(/^(?:#{1,2}\s+[^\n]+\n\s*)+/, "")
          .trimStart();
      }

      function renderVersionPicker({
        id,
        versions,
        selectedId,
        action,
        label,
      }) {
        const selected = versions.find((version) => version.id === selectedId)
          || versions[0];
        return `
          <div class="version-picker" data-version-picker="${escapeHtml(id)}">
            <button
              class="version-trigger"
              type="button"
              data-picker-trigger="${escapeHtml(id)}"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="${escapeHtml(label)}"
            >
              <span>${escapeHtml(selected?.label || "选择版本")}</span>
            </button>
            <div
              class="version-menu"
              data-picker-menu="${escapeHtml(id)}"
              role="listbox"
              aria-label="${escapeHtml(label)}"
              hidden
            >
              ${versions.map((version) => `
                <button
                  class="version-option"
                  type="button"
                  role="option"
                  aria-selected="${version.id === selected?.id}"
                  data-picker-action="${escapeHtml(action)}"
                  data-picker-value="${escapeHtml(version.id)}"
                >
                  <span>${escapeHtml(version.label)}</span>
                  ${version.adopted ? "<small>已采用</small>" : ""}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }

      function diffArray(left, right) {
        const rows = Array.from(
          { length: left.length + 1 },
          () => new Uint16Array(right.length + 1)
        );
        for (let i = left.length - 1; i >= 0; i -= 1) {
          for (let j = right.length - 1; j >= 0; j -= 1) {
            rows[i][j] =
              left[i] === right[j]
                ? rows[i + 1][j + 1] + 1
                : Math.max(rows[i + 1][j], rows[i][j + 1]);
          }
        }

        const result = [];
        let i = 0;
        let j = 0;
        while (i < left.length && j < right.length) {
          if (left[i] === right[j]) {
            result.push({ type: "equal", value: left[i] });
            i += 1;
            j += 1;
          } else if (rows[i + 1][j] >= rows[i][j + 1]) {
            result.push({ type: "remove", value: left[i] });
            i += 1;
          } else {
            result.push({ type: "add", value: right[j] });
            j += 1;
          }
        }
        while (i < left.length) {
          result.push({ type: "remove", value: left[i] });
          i += 1;
        }
        while (j < right.length) {
          result.push({ type: "add", value: right[j] });
          j += 1;
        }
        return result;
      }

      const wordSegmenter =
        typeof Intl.Segmenter === "function"
          ? new Intl.Segmenter("zh-CN", { granularity: "word" })
          : null;

      function tokenizeForDiff(value) {
        if (wordSegmenter) {
          return Array.from(
            wordSegmenter.segment(value),
            (segment) => segment.segment
          );
        }
        return value.match(/[A-Za-z0-9]+|[\u3400-\u9fff]|[^\u3400-\u9fffA-Za-z0-9]/gu)
          || [];
      }

      function wordDiffMarkup(left, right) {
        const operations = diffArray(
          tokenizeForDiff(left),
          tokenizeForDiff(right)
        );
        let html = "";
        let type = "";
        let buffer = "";
        const flush = () => {
          if (!buffer) return;
          const escaped = escapeHtml(buffer);
          html +=
            type === "remove"
              ? `<del>${escaped}</del>`
              : type === "add"
                ? `<ins>${escaped}</ins>`
                : escaped;
          buffer = "";
        };
        operations.forEach((operation) => {
          if (operation.type !== type) {
            flush();
            type = operation.type;
          }
          buffer += operation.value;
        });
        flush();
        return html;
      }

      function describeDiffBlock(value) {
        const text = value.trim();
        const heading = text.match(/^(#{1,2})\s+([\s\S]*)$/);
        if (heading) {
          return {
            tag: heading[1].length === 1 ? "h1" : "h2",
            text: heading[2],
            extraClass: "",
          };
        }
        return {
          tag: "p",
          text,
          extraClass: text.startsWith("〔译者注：") ? " translator-note" : "",
        };
      }

      function renderDiffBlock(left, right, state) {
        const source = right || left;
        const descriptor = describeDiffBlock(source);
        let contents = "";
        if (state === "changed") {
          const oldBlock = describeDiffBlock(left);
          const newBlock = describeDiffBlock(right);
          contents = wordDiffMarkup(oldBlock.text, newBlock.text);
        } else if (state === "removed") {
          contents = `<del>${escapeHtml(descriptor.text)}</del>`;
        } else if (state === "added") {
          contents = `<ins>${escapeHtml(descriptor.text)}</ins>`;
        } else {
          contents = escapeHtml(descriptor.text);
        }
        return `<${descriptor.tag} class="diff-block ${state}${descriptor.extraClass}">${contents}</${descriptor.tag}>`;
      }

      function renderVersionDiff(leftValue, rightValue, onlyChanges, mode) {
        const leftBlocks = stripLeadingDocumentHeadings(leftValue)
          .split(/\n{2,}/)
          .map((block) => block.trim())
          .filter(Boolean);
        const rightBlocks = stripLeadingDocumentHeadings(rightValue)
          .split(/\n{2,}/)
          .map((block) => block.trim())
          .filter(Boolean);
        const operations = diffArray(leftBlocks, rightBlocks);
        const output = [];
        let removed = [];
        let added = [];

        const flushChanges = () => {
          if (mode === "paragraph") {
            const blockCount = Math.max(removed.length, added.length);
            for (let index = 0; index < blockCount; index += 1) {
              if (removed[index]) {
                output.push(
                  renderDiffBlock(removed[index], "", "removed")
                );
              }
              if (added[index]) {
                output.push(
                  renderDiffBlock("", added[index], "added")
                );
              }
            }
            removed = [];
            added = [];
            return;
          }
          const pairCount = Math.min(removed.length, added.length);
          for (let index = 0; index < pairCount; index += 1) {
            output.push(
              renderDiffBlock(removed[index], added[index], "changed")
            );
          }
          removed.slice(pairCount).forEach((block) => {
            output.push(renderDiffBlock(block, "", "removed"));
          });
          added.slice(pairCount).forEach((block) => {
            output.push(renderDiffBlock("", block, "added"));
          });
          removed = [];
          added = [];
        };

        operations.forEach((operation) => {
          if (operation.type === "equal") {
            flushChanges();
            if (!onlyChanges) {
              output.push(
                renderDiffBlock(operation.value, operation.value, "unchanged")
              );
            }
          } else if (operation.type === "remove") {
            removed.push(operation.value);
          } else {
            added.push(operation.value);
          }
        });
        flushChanges();
        return output.join("")
          || '<div class="empty">这两个版本没有文字差异。</div>';
      }

      function comparisonPair(unit) {
        const versions = unit?.versions || [];
        const target =
          versions.find((version) => version.id === model.compareTargetVersionId)
          || displayedVersion(unit)
          || versions[0];
        const targetNumber = Number(target?.number || 0);
        const base =
          versions
            .filter((version) => version.id !== target?.id)
            .sort((a, b) => {
              const aDistance = Math.abs(Number(a.number || 0) - targetNumber);
              const bDistance = Math.abs(Number(b.number || 0) - targetNumber);
              return aDistance - bDistance;
            })[0]
          || target;
        const selectedBase =
          versions.find(
            (version) =>
              version.id === model.compareBaseVersionId
              && version.id !== target?.id
          )
          || base;
        model.compareBaseVersionId = selectedBase?.id || null;
        model.compareTargetVersionId = target?.id || null;
        return { base: selectedBase, target };
      }

      function dateText(value) {
        if (!value) return "—";
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Asia/Shanghai",
        }).format(new Date(value));
      }

      function allChapters() {
        return model.state.parts.flatMap((part) =>
          part.chapters.map((chapter) => ({
            ...chapter,
            partId: part.id,
            partNumber: part.number,
            partTitle: part.title,
          }))
        );
      }

      function currentChapter() {
        return allChapters().find((chapter) => chapter.id === model.chapterId);
      }

      function currentUnit() {
        const chapter = currentChapter();
        return chapter?.sections?.find((unit) => unit.unit_id === model.unitId);
      }

      function displayedVersion(unit = currentUnit()) {
        if (!unit?.versions?.length) return null;
        return (
          unit.versions.find(
            (version) => version.id === model.selectedVersionId
          ) ||
          unit.versions.find(
            (version) => version.id === unit.adoptedVersionId
          ) ||
          unit.versions[0]
        );
      }

      function selectChapter(chapterId) {
        model.chapterId = chapterId;
        const chapter = currentChapter();
        const preferred =
          chapter.sections?.find((unit) => unit.preview) ||
          chapter.sections?.find((unit) => unit.status !== "planned") ||
          chapter.sections?.[0];
        model.unitId = preferred?.unit_id || null;
        model.selectedVersionId = null;
        model.view = "text";
        model.compareMode = false;
        model.compareBaseVersionId = null;
        model.compareTargetVersionId = null;
        saveReadingPosition();
        render();
        if (matchMedia("(max-width: 900px)").matches) {
          setCatalogCollapsed(true);
          requestAnimationFrame(() => {
            el("workspace").scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          });
        }
      }

      function renderCatalog() {
        el("catalog").innerHTML = `
          <div class="catalog-toolbar">
            <strong>全书目录</strong>
            <button
              class="catalog-control"
              id="catalogCollapse"
              type="button"
              aria-controls="catalog"
              aria-expanded="true"
            >收起</button>
          </div>
          ${model.state.parts.map((part) => `
            <section class="part">
              <p class="part-title">第${part.number}篇 · ${escapeHtml(part.title)}</p>
              ${part.chapters.map((chapter) => `
                <button
                  class="chapter ${chapter.id === model.chapterId ? "selected" : ""}"
                  data-chapter="${chapter.id}"
                  aria-current="${chapter.id === model.chapterId ? "true" : "false"}"
                >
                  <span class="chapter-no">${String(chapter.number).padStart(2, "0")}</span>
                  <span class="chapter-title">${escapeHtml(chapter.title)}</span>
                  <span class="chapter-meta">
                    <span class="dot ${chapter.status}"></span>
                    ${chapter.statusLabel}${chapter.versionCount ? ` · ${chapter.versionCount}版` : ""}
                  </span>
                </button>
              `).join("")}
            </section>
          `).join("")}
        `;

        document.querySelectorAll("[data-chapter]").forEach((button) => {
          button.addEventListener("click", () => selectChapter(button.dataset.chapter));
        });
        el("catalogCollapse")?.addEventListener("click", () => {
          setCatalogCollapsed(true, true);
        });
        setCatalogCollapsed(
          el("workspace").classList.contains("catalog-collapsed")
        );
      }

      function renderSections(chapter) {
        const sections = chapter.sections || [];
        if (!sections.length) {
          el("sectionList").style.display = "none";
          el("sectionList").innerHTML = "";
          return;
        }
        el("sectionList").style.display = "flex";
        el("sectionList").innerHTML = sections.map((unit) => `
          <button
            class="section-button ${unit.unit_id === model.unitId ? "selected" : ""}"
            data-unit="${unit.unit_id}"
          >
            <span>
              <strong>${unit.number ? `第${unit.number}节 · ` : ""}${escapeHtml(unit.title_zh)}</strong>
              <span>${unit.statusLabel}${unit.versionCount ? ` · ${unit.versionCount} 个版本` : ""}</span>
            </span>
            <span class="dot ${unit.status}"></span>
          </button>
        `).join("");

        document.querySelectorAll("[data-unit]").forEach((button) => {
          button.addEventListener("click", () => {
            model.unitId = button.dataset.unit;
            model.selectedVersionId = null;
            model.view = "text";
            model.compareMode = false;
            model.compareBaseVersionId = null;
            model.compareTargetVersionId = null;
            saveReadingPosition();
            render();
          });
        });
      }

      function renderText(unit) {
        const version = displayedVersion(unit);
        const preview = version?.preview || unit?.preview || "";
        if (!preview) {
          return '<div class="empty">尚未形成译文。</div>';
        }
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)}</h3>
            <div class="version-tools">
              ${unit.versions.length > 1
                ? renderVersionPicker({
                    id: "display-version",
                    versions: unit.versions,
                    selectedId: version?.id,
                    action: "display",
                    label: "选择阅读版本",
                  })
                : `<span class="version-tag">${version?.label || ""}</span>`}
              ${unit.versions.length > 1
                ? '<button class="small-action" id="compareButton">比较版本</button>'
                : ""}
              ${version?.adopted
                ? '<span class="adopted-mark">已采用</span>'
                : version?.reviewStatus === "needs_review"
                  ? '<span class="version-tag">待复核</span>'
                : version
                  ? '<button class="small-action" id="adoptButton">采用此版本</button>'
                  : ""}
            </div>
          </div>
          ${version?.reviewStatus === "needs_review" && version?.reviewNote
            ? `<div class="review-notice"><strong>终审待复核：</strong>${escapeHtml(version.reviewNote)}</div>`
            : ""}
          <div class="prose">${renderMarkdown(stripLeadingDocumentHeadings(preview))}</div>
        `;
      }

      function renderComparison(unit) {
        if (!unit?.versions || unit.versions.length < 2) {
          return '<div class="empty">至少需要两个版本才能比较。</div>';
        }
        const { base, target } = comparisonPair(unit);
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)} · 版本比较</h3>
            <button class="small-action" id="closeCompareButton">返回正文</button>
          </div>
          <div class="diff-toolbar">
            <div class="diff-choice">
              <span>原版本</span>
              ${renderVersionPicker({
                id: "compare-base",
                versions: unit.versions,
                selectedId: base?.id,
                action: "compare-base",
                label: "选择作为比较起点的版本",
              })}
            </div>
            <span class="diff-arrow">→</span>
            <div class="diff-choice">
              <span>新版本</span>
              ${renderVersionPicker({
                id: "compare-target",
                versions: unit.versions,
                selectedId: target?.id,
                action: "compare-target",
                label: "选择要比较的新版本",
              })}
            </div>
            <div class="diff-mode" role="group" aria-label="差异显示方式">
              <button
                class="small-action ${model.diffMode === "inline" ? "active" : ""}"
                type="button"
                data-diff-mode="inline"
                aria-pressed="${model.diffMode === "inline"}"
              >行内</button>
              <button
                class="small-action ${model.diffMode === "paragraph" ? "active" : ""}"
                type="button"
                data-diff-mode="paragraph"
                aria-pressed="${model.diffMode === "paragraph"}"
              >整段</button>
            </div>
            <button class="small-action diff-filter" id="diffFilterButton">
              ${model.diffOnly ? "显示全文" : "只看改动"}
            </button>
          </div>
          <div class="diff-legend" aria-label="差异标记说明">
            <span class="removed">删去</span>
            <span class="added">新增</span>
          </div>
          <div class="prose diff-prose ${model.diffMode === "paragraph" ? "paragraph-mode" : "inline-mode"}">
            ${renderVersionDiff(
              base?.preview || "",
              target?.preview || "",
              model.diffOnly,
              model.diffMode
            )}
          </div>
        `;
      }

      function renderVersions(unit) {
        if (!unit?.versions?.length) {
          return '<div class="empty">暂无版本。</div>';
        }
        return `
          <div class="reader-title">
            <h3>${escapeHtml(unit.title_zh)}</h3>
          </div>
          <div class="versions">
            ${unit.versions.map((version) => `
              <div class="version-row">
                <strong>${escapeHtml(version.label)}</strong>
                <p>${escapeHtml(version.summary || version.status)}${version.taskCount ? ` · ${version.taskCount} 个片段` : ""}</p>
                <time>${dateText(version.updatedAt)}</time>
                <div class="version-actions">
                  <button class="small-action" data-preview-version="${version.id}">预览</button>
                  ${version.adopted
                    ? '<span class="adopted-mark">已采用</span>'
                    : version.reviewStatus === "needs_review"
                      ? '<span class="version-tag">待复核</span>'
                    : `<button class="small-action" data-adopt-version="${version.id}">采用</button>`}
                </div>
                ${version.reviewStatus === "needs_review" && version.reviewNote
                  ? `<div class="review-notice"><strong>终审待复核：</strong>${escapeHtml(version.reviewNote)}</div>`
                  : ""}
              </div>
            `).join("")}
          </div>
        `;
      }

      async function adoptVersion(versionId) {
        const unit = currentUnit();
        if (!unit || !versionId) return;
        const response = await fetch("/api/adopt", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            unitId: unit.unit_id,
            versionId,
          }),
        });
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          alert(result.error || "无法采用这个版本");
          return;
        }
        model.selectedVersionId = versionId;
        saveReadingPosition();
        await refresh(true);
      }

      function closeVersionPickers() {
        document.querySelectorAll("[data-picker-menu]").forEach((menu) => {
          menu.hidden = true;
        });
        document.querySelectorAll("[data-picker-trigger]").forEach((trigger) => {
          trigger.setAttribute("aria-expanded", "false");
        });
      }

      function bindVersionPickers() {
        document.querySelectorAll("[data-version-picker]").forEach((picker) => {
          const trigger = picker.querySelector("[data-picker-trigger]");
          const menu = picker.querySelector("[data-picker-menu]");
          const options = Array.from(
            picker.querySelectorAll("[data-picker-action]")
          );
          trigger.addEventListener("click", (event) => {
            event.stopPropagation();
            const shouldOpen = menu.hidden;
            closeVersionPickers();
            menu.hidden = !shouldOpen;
            trigger.setAttribute("aria-expanded", String(shouldOpen));
            if (shouldOpen) {
              options.find(
                (option) => option.getAttribute("aria-selected") === "true"
              )?.focus();
            }
          });
          options.forEach((option, index) => {
            option.addEventListener("click", () => {
              const action = option.dataset.pickerAction;
              const value = option.dataset.pickerValue;
              closeVersionPickers();
              if (action === "display") {
                model.selectedVersionId = value;
                saveReadingPosition();
              } else if (action === "compare-base") {
                model.compareBaseVersionId = value;
                if (model.compareTargetVersionId === value) {
                  model.compareTargetVersionId =
                    currentUnit()?.versions.find(
                      (version) => version.id !== value
                    )?.id || null;
                }
              } else if (action === "compare-target") {
                model.compareTargetVersionId = value;
                if (model.compareBaseVersionId === value) {
                  model.compareBaseVersionId =
                    currentUnit()?.versions.find(
                      (version) => version.id !== value
                    )?.id || null;
                }
              }
              renderReader();
            });
            option.addEventListener("keydown", (event) => {
              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                const direction = event.key === "ArrowDown" ? 1 : -1;
                options[(index + direction + options.length) % options.length]
                  ?.focus();
              } else if (event.key === "Escape") {
                closeVersionPickers();
                trigger.focus();
              }
            });
          });
        });
      }

      function bindReaderActions() {
        bindVersionPickers();
        const compareButton = el("compareButton");
        if (compareButton) {
          compareButton.addEventListener("click", () => {
            model.compareMode = true;
            model.compareBaseVersionId = null;
            model.compareTargetVersionId = displayedVersion()?.id || null;
            renderReader();
          });
        }
        const closeCompareButton = el("closeCompareButton");
        if (closeCompareButton) {
          closeCompareButton.addEventListener("click", () => {
            model.compareMode = false;
            renderReader();
          });
        }
        const diffFilterButton = el("diffFilterButton");
        if (diffFilterButton) {
          diffFilterButton.addEventListener("click", () => {
            model.diffOnly = !model.diffOnly;
            renderReader();
          });
        }
        document.querySelectorAll("[data-diff-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            model.diffMode = button.dataset.diffMode;
            renderReader();
          });
        });
        const adoptButton = el("adoptButton");
        if (adoptButton) {
          adoptButton.addEventListener("click", async () => {
            try {
              await adoptVersion(displayedVersion()?.id);
            } catch {
              adoptButton.textContent = "未能采用";
            }
          });
        }
        document.querySelectorAll("[data-preview-version]").forEach((button) => {
          button.addEventListener("click", () => {
            model.selectedVersionId = button.dataset.previewVersion;
            model.view = "text";
            model.compareMode = false;
            saveReadingPosition();
            render();
          });
        });
        document.querySelectorAll("[data-adopt-version]").forEach((button) => {
          button.addEventListener("click", async () => {
            try {
              await adoptVersion(button.dataset.adoptVersion);
            } catch {
              button.textContent = "未能采用";
            }
          });
        });
      }

      function renderReader() {
        const unit = currentUnit();
        el("reader").innerHTML =
          model.view === "versions"
            ? renderVersions(unit)
            : model.compareMode
              ? renderComparison(unit)
              : renderText(unit);
        bindReaderActions();
      }

      function render() {
        const state = model.state;
        const chapter = currentChapter();
        if (!chapter) return;

        el("partCount").textContent = state.book.partCount;
        el("chapterCount").textContent = state.book.chapterCount;
        el("completedUnits").textContent = state.book.completedUnitCount;
        el("versionCount").textContent = state.book.versionCount;
        el("updated").textContent = `更新 ${dateText(state.updatedAt)}`;

        el("chapterPart").textContent = `第${chapter.partNumber}篇 · ${chapter.partTitle}`;
        el("chapterTitle").textContent = `${chapter.numberLabel} ${chapter.title}`;
        el("chapterStatus").textContent = chapter.statusLabel;
        el("chapterStatus").className = `status ${chapter.status}`;
        el("chapterSections").textContent =
          chapter.totalSections > 1
            ? `${chapter.completedSections}/${chapter.totalSections} 节完成`
            : "";
        el("chapterVersions").textContent =
          chapter.versionCount > 0 ? `${chapter.versionCount} 个版本` : "";

        renderCatalog();
        renderSections(chapter);
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.view === model.view);
        });
        renderReader();
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          model.view = tab.dataset.view;
          if (model.view !== "text") model.compareMode = false;
          render();
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-version-picker]")) {
          closeVersionPickers();
        }
      });

      el("catalogExpand").addEventListener("click", () => {
        setCatalogCollapsed(false, true);
      });
      try {
        setCatalogCollapsed(
          localStorage.getItem(catalogPreferenceKey) === "true"
        );
      } catch {
        setCatalogCollapsed(false);
      }

      el("themeToggle").addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        setTheme(next, true);
      });
      themeQuery.addEventListener?.("change", (event) => {
        try {
          if (!localStorage.getItem("capital-progress-theme")) {
            setTheme(event.matches ? "dark" : "light");
          }
        } catch {}
      });
      updateThemeToggle();

      function renderAnalytics(metrics) {
        el("visitorCount").textContent =
          Number(metrics?.totalVisitors || 0).toLocaleString("zh-CN");
        el("pageViewCount").textContent =
          Number(metrics?.totalViews || 0).toLocaleString("zh-CN");
      }

      async function trackVisit() {
        try {
          const response = await fetch("/api/analytics/track", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "same-origin",
            keepalive: true,
            body: JSON.stringify({
              path: location.pathname,
              queryString: location.search,
              pageTitle: document.title,
              referrer: document.referrer,
              clientLanguage: navigator.language,
              clientTimezone:
                Intl.DateTimeFormat().resolvedOptions().timeZone || "",
              screenWidth: screen.width,
              screenHeight: screen.height,
              viewportWidth: innerWidth,
              viewportHeight: innerHeight,
            }),
          });
          if (response.ok) renderAnalytics(await response.json());
        } catch {}
      }

      async function refresh(forceRender = false) {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error("state unavailable");
          const next = await response.json();
           const shouldRender =
             forceRender ||
             !model.state ||
             next.updatedAt !== model.state.updatedAt;
           model.state = next;
           if (!readingPositionRestored) {
             const saved = readReadingPosition();
             model.chapterId = saved?.chapterId || null;
             model.unitId = saved?.unitId || null;
             model.selectedVersionId = saved?.selectedVersionId || null;
             readingPositionRestored = true;
           }
           if (!currentChapter()) {
             model.chapterId =
               next.parts[0]?.chapters[0]?.id || next.defaultChapterId;
           }
           const current = currentChapter();
           if (
             !current?.sections?.some((unit) => unit.unit_id === model.unitId)
           ) {
             const preferred =
               current.sections?.find((unit) => unit.preview) ||
               current.sections?.find((unit) => unit.status !== "planned") ||
              current.sections?.[0];
            model.unitId = preferred?.unit_id || null;
          }
          const unit = currentUnit();
          if (
            model.selectedVersionId &&
            !unit?.versions?.some(
              (version) => version.id === model.selectedVersionId
            )
           ) {
             model.selectedVersionId = null;
           }
           saveReadingPosition();
           if (shouldRender) render();
        } catch {
          el("updated").textContent = "读取失败";
        }
      }

      refresh();
      trackVisit();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
