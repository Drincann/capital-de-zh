name: Publish static reader to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "capital-online-preview/**"
      - "outputs/capital-volume1-de-zh-new/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capital-online-preview/package-lock.json
      - run: npm ci
        working-directory: capital-online-preview
      - name: Install Chinese PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build:pages
        working-directory: capital-online-preview
      - run: node --test tests/pages-build.test.mjs
        working-directory: capital-online-preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: capital-online-preview/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
